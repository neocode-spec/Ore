<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Browser tab -->
    <title>Ore</title>

    <!-- Ore green diamond favicon -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 L61 32 L32 61 L3 32 Z' fill='none' stroke='%2300ff66' stroke-width='5'/%3E%3Cpath d='M32 15 L49 32 L32 49 L15 32 Z' fill='%2300ff66'/%3E%3C/svg%3E"
    >

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oreGreen: "#00ff66",
                        oreBlack: "#050505"
                    }
                }
            }
        };
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050505;
            color: white;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        /* Scrollbars */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #050505;
        }

        ::-webkit-scrollbar-thumb {
            background: #252525;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #333333;
        }

        /* Ore logo */

        .ore-logo {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
        }

        .ore-logo-small {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }

        /* Sidebar */

        #sidebar {
            width: 360px;
            flex-shrink: 0;
        }

        /* Main */

        #main {
            min-width: 0;
            min-height: 0;
        }

        /* Chat */

        #chat-container {
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #messages {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: 32px 24px 180px 24px;
        }

        /* Welcome */

        #welcome-screen {
            min-height: 100%;
            overflow-y: auto;
        }

        /* Composer */

        #composer-wrapper {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        #composer {
            pointer-events: auto;
        }

        /* Mobile sidebar */

        @media (max-width: 900px) {

            #sidebar {
                position: fixed;
                z-index: 50;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 20px 0 50px rgba(0,0,0,0.5);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #sidebar-overlay {
                display: none;
            }

            #sidebar-overlay.open {
                display: block;
            }
        }

        /* Desktop */

        @media (min-width: 901px) {
            #mobile-menu {
                display: none;
            }

            #sidebar-overlay {
                display: none !important;
            }
        }

    </style>
</head>

<body>

<div class="h-screen w-screen bg-[#050505] flex overflow-hidden">

    <!-- ========================================================= -->
    <!-- SIDEBAR -->
    <!-- ========================================================= -->

    <aside
        id="sidebar"
        class="h-full bg-[#070707] border-r border-white/[0.08] flex flex-col"
    >

        <!-- Logo -->

        <div class="px-6 pt-7 pb-6">

            <div class="flex items-center gap-3">

                <svg
                    class="ore-logo"
                    viewBox="0 0 64 64"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M32 3L61 32L32 61L3 32L32 3Z"
                        stroke="#00FF66"
                        stroke-width="5"
                    />

                    <path
                        d="M32 15L49 32L32 49L15 32L32 15Z"
                        fill="#00FF66"
                    />
                </svg>

                <span class="text-2xl font-semibold tracking-tight">
                    Ore
                </span>

            </div>

        </div>


        <!-- New Chat -->

        <div class="px-4">

            <button
                id="new-chat-button"
                class="
                    w-full
                    h-14
                    rounded-2xl
                    border
                    border-white/[0.10]
                    bg-[#111111]
                    hover:bg-[#171717]
                    transition
                    flex
                    items-center
                    gap-4
                    px-5
                    text-[16px]
                "
            >

                <span class="text-2xl leading-none font-light">
                    +
                </span>

                <span>
                    New chat
                </span>

            </button>

        </div>


        <!-- Recent -->

        <div class="flex-1 overflow-y-auto px-7 pt-10">

            <div
                class="
                    text-[13px]
                    uppercase
                    tracking-wider
                    text-gray-500
                    mb-5
                "
            >
                Recent
            </div>

            <div
                id="recent-list"
                class="text-gray-500 text-[15px]"
            >
                No conversations yet
            </div>

        </div>


        <!-- User -->

        <div class="border-t border-white/[0.08] p-5">

            <div class="flex items-center justify-between">

                <div class="flex items-center gap-3">

                    <div
                        class="
                            w-11
                            h-11
                            rounded-full
                            bg-[#202020]
                            flex
                            items-center
                            justify-center
                            text-lg
                            font-medium
                        "
                    >
                        G
                    </div>

                    <div>

                        <div class="font-semibold">
                            Guest
                        </div>

                        <div class="text-sm text-gray-500">
                            Free
                        </div>

                    </div>

                </div>


                <button
                    class="
                        text-gray-500
                        hover:text-white
                        transition
                        text-xl
                    "
                    title="Settings"
                >
                    ⚙
                </button>

            </div>

        </div>

    </aside>


    <!-- Mobile overlay -->

    <div
        id="sidebar-overlay"
        class="
            fixed
            inset-0
            bg-black/60
            z-40
        "
    ></div>


    <!-- ========================================================= -->
    <!-- MAIN -->
    <!-- ========================================================= -->

    <main
        id="main"
        class="flex-1 h-full flex flex-col relative min-w-0"
    >

        <!-- Header -->

        <header
            class="
                h-[82px]
                flex-shrink-0
                border-b
                border-white/[0.08]
                flex
                items-center
                px-5
                md:px-8
                bg-[#050505]
            "
        >

            <!-- Mobile menu -->

            <button
                id="mobile-menu"
                class="
                    mr-4
                    text-gray-400
                    hover:text-white
                    text-2xl
                "
            >
                ☰
            </button>


            <div class="flex items-center gap-3">

                <svg
                    class="ore-logo-small"
                    viewBox="0 0 64 64"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M32 3L61 32L32 61L3 32L32 3Z"
                        stroke="#00FF66"
                        stroke-width="5"
                    />

                    <path
                        d="M32 15L49 32L32 49L15 32L32 15Z"
                        fill="#00FF66"
                    />
                </svg>

                <span class="text-xl font-semibold">
                    Ore
                </span>

            </div>

        </header>


        <!-- ===================================================== -->
        <!-- CHAT -->
        <!-- ===================================================== -->

        <div
            id="chat-container"
            class="flex-1 relative"
        >

            <!-- Welcome -->

            <section

                class="

                    overflow-y-auto
                    flex

                    px-5
                "
            >

                <div
                    class="
                        w-full
                        max-w-[900px]
                        text-center
                        pt-10
                        md:pt-14
                        pb-40
                    "
                >

                    <!-- Large Ore logo -->

                    <div class="flex justify-center mb-8">

                        <svg
                            class="w-28 h-28 md:w-32 md:h-32"
                            viewBox="0 0 64 64"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                            <path
                                d="M32 3L61 32L32 61L3 32L32 3Z"
                                stroke="#00FF66"
                                stroke-width="4"
                            />

                            <path
                                d="M32 15L49 32L32 49L15 32L32 15Z"
                                fill="#00FF66"
                            />

                        </svg>

                    </div>


                    <!-- Heading -->

                    <h1

                            text-4xl

                            font-semibold
                            tracking-tight
                            mb-5
                        "
                    >

                    </h1>


                    <!-- Description -->

                    <p

                    >

                            <div class="text-gray-500 text-sm mt-2">

                        </button>


                        <button
                            class="prompt-card"

                        >

                        <button

                        >

                            </div>

                            <div class="text-gray-500 text-sm mt-2">
                                Explore Nigeria's cultures and languages
                            </div>

                        </button>


                        <button
                            class="prompt-card"
                            data-prompt="Tell me about technology in Nigeria."
                        >

                            <div class="font-semibold text-[16px]">

                            </div>

                            <div class="text-gray-500 text-sm mt-2">

            <!-- Messages -->

            <!-- ================================================= -->

            <div

            >

                <div

                    class="
                        max-w-[990px]

                        rounded-3xl
                        border

                        bg-[#0c0c0c]
                        shadow-[0_10px_60px_rgba(0,0,0,0.45)]

                    <!-- Input -->

                    <textarea

                            <button

<!-- ============================================================= -->
<!-- JAVASCRIPT -->
<!-- ============================================================= -->

<script>

    /*
    ================================================================
    BACKEND CONFIGURATION
    ================================================================

    For now this is EMPTY.

    Later we will put the public FastAPI URL here.

    Example:

    const API_URL = "https://your-ore-backend-url.com";

    Do NOT put the Colab localhost address here.
    ================================================================
    */

    const API_URL = "";


    /*
    ================================================================
    STATE
    ================================================================
    */

    let currentLanguage = "pidgin";

    let conversationStarted = false;

    let isGenerating = false;


    /*
    ================================================================
    ELEMENTS
    ================================================================
    */

    const messageInput =
        document.getElementById("message-input");

    const sendButton =
        document.getElementById("send-button");

    const welcomeScreen =
        document.getElementById("welcome-screen");

    const messages =
        document.getElementById("messages");

    const chatContainer =
        document.getElementById("chat-container");

    const pidginButton =
        document.getElementById("pidgin-button");

    const englishButton =
        document.getElementById("english-button");

    const newChatButton =
        document.getElementById("new-chat-button");

    const mobileMenu =
        document.getElementById("mobile-menu");

    const sidebar =
        document.getElementById("sidebar");

    const sidebarOverlay =
        document.getElementById("sidebar-overlay");


    /*
    ================================================================
    PROMPT CARD STYLING
    ================================================================
    */

    document.querySelectorAll(".prompt-card").forEach(card => {

        card.className = `
            prompt-card
            w-full
            min-h-[94px]
            rounded-2xl
            border
            border-white/[0.10]
            bg-[#0d0d0d]
            hover:bg-[#151515]
            hover:border-white/[0.16]
            transition
            p-5
            cursor-pointer
        `;

    });


    /*
    ================================================================
    ENABLE / DISABLE SEND
    ================================================================
    */

    function updateSendButton() {

        const hasText =
            messageInput.value.trim().length > 0;

        sendButton.disabled =
            !hasText || isGenerating;

    }


    messageInput.addEventListener(
        "input",
        () => {

            updateSendButton();

            /*
            Auto-grow textarea
            */

            messageInput.style.height = "auto";

            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    180
                ) + "px";

        }
    );


    /*
    ================================================================
    LANGUAGE SWITCH
    ================================================================
    */

    pidginButton.addEventListener(
        "click",
        () => {

            currentLanguage = "pidgin";

            pidginButton.classList.add(
                "bg-[#202020]",
                "text-white",
                "font-semibold"
            );

            pidginButton.classList.remove(
                "text-gray-500"
            );

            englishButton.classList.remove(
                "bg-[#202020]",
                "text-white",
                "font-semibold"
            );

            englishButton.classList.add(
                "text-gray-500"
            );

        }
    );


    englishButton.addEventListener(
        "click",
        () => {

            currentLanguage = "english";

            englishButton.classList.add(
                "bg-[#202020]",
                "text-white",
                "font-semibold"
            );

            englishButton.classList.remove(
                "text-gray-500"
            );

            pidginButton.classList.remove(
                "bg-[#202020]",
                "text-white",
                "font-semibold"
            );

            pidginButton.classList.add(
                "text-gray-500"
            );

        }
    );


    /*
    ================================================================
    ADD MESSAGE
    ================================================================
    */

    function addMessage(
        text,
        role
    ) {

        /*
        Start chat mode
        */

        if (!conversationStarted) {

            conversationStarted = true;

            welcomeScreen.classList.add(
                "hidden"
            );

            messages.classList.remove(
                "hidden"
            );

        }


        const wrapper =
            document.createElement("div");


        wrapper.className =
            role === "user"
                ? "flex justify-end mb-8"
                : "flex justify-start mb-10";


        if (role === "user") {

            const bubble =
                document.createElement("div");

            bubble.className = `
                max-w-[80%]
                md:max-w-[70%]
                bg-[#1c1c1c]
                rounded-3xl
                px-5
                py-3.5
                text-[16px]
                leading-relaxed
            `;

            /*
            textContent prevents HTML injection
            */

            bubble.textContent = text;

            wrapper.appendChild(
                bubble
            );

        } else {

            const content =
                document.createElement("div");

            content.className = `
                flex
                gap-4
                max-w-[850px]
                mx-auto
                w-full
            `;


            const logo =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );

            logo.setAttribute(
                "viewBox",
                "0 0 64 64"
            );

            logo.setAttribute(
                "class",
                "w-9 h-9 flex-shrink-0"
            );


            logo.innerHTML = `
                <path
                    d="M32 3L61 32L32 61L3 32L32 3Z"
                    stroke="#00FF66"
                    stroke-width="5"
                    fill="none"
                />

                <path
                    d="M32 15L49 32L32 49L15 32L32 15Z"
                    fill="#00FF66"
                />
            `;


            const textDiv =
                document.createElement("div");

            textDiv.className = `
                flex-1
                text-[16px]
                leading-7
                text-gray-200
                whitespace-pre-wrap
            `;

            textDiv.textContent = text;


            content.appendChild(
                logo
            );

            content.appendChild(
                textDiv
            );

            wrapper.appendChild(
                content
            );

        }


        messages.appendChild(
            wrapper
        );


        /*
        Scroll to bottom
        */

        requestAnimationFrame(() => {

            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: "smooth"
            });

        });

    }


    /*
    ================================================================
    TYPING INDICATOR
    ================================================================
    */

    function addTypingIndicator() {

        const wrapper =
            document.createElement("div");

        wrapper.id =
            "typing-indicator";

        wrapper.className = `
            flex
            gap-4
            max-w-[850px]
            mx-auto
            w-full
            mb-10
        `;


        wrapper.innerHTML = `

            <svg
                viewBox="0 0 64 64"
                class="w-9 h-9 flex-shrink-0"
            >

                <path
                    d="M32 3L61 32L32 61L3 32L32 3Z"
                    stroke="#00FF66"
                    stroke-width="5"
                    fill="none"
                />

                <path
                    d="M32 15L49 32L32 49L15 32L32 15Z"
                    fill="#00FF66"
                />

            </svg>

            <div
                class="
                    text-gray-500
                    text-2xl
                    tracking-widest
                "
            >
                ···
            </div>

        `;


        messages.appendChild(
            wrapper
        );


        chatContainer.scrollTo({
            top: chatContainer.scrollHeight,
            behavior: "smooth"
        });

    }


    function removeTypingIndicator() {

        const indicator =
            document.getElementById(
                "typing-indicator"
            );

        if (indicator) {
            indicator.remove();
        }

    }


    /*
    ================================================================
    SEND MESSAGE
    ================================================================
    */

    async function sendMessage() {

        const userMessage =
            messageInput.value.trim();


        if (
            !userMessage ||
            isGenerating
        ) {
            return;
        }


        /*
        Display user's message
        */

        addMessage(
            userMessage,
            "user"
        );


        /*
        Clear input
        */

        messageInput.value = "";

        messageInput.style.height =
            "auto";

        updateSendButton();


        isGenerating = true;

        updateSendButton();

        addTypingIndicator();


        try {

            /*
            ========================================================
            REAL BACKEND REQUEST
            ========================================================

            This is already prepared.

            Once we have the public FastAPI URL,
            API_URL will point to it.
            ========================================================
            */

            if (!API_URL) {

                throw new Error(
                    "Backend URL has not been configured yet."
                );

            }


            const response =
                await fetch(
                    `${API_URL}/api/chat`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message:
                                userMessage,

                            language:
                                currentLanguage

                        })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Backend returned ${response.status}`
                );

            }


            const data =
                await response.json();


            removeTypingIndicator();


            const oreResponse =
                data.response ||
                "Ore did not return a response.";


            addMessage(
                oreResponse,
                "ore"
            );


        } catch (error) {

            console.error(
                "Ore backend error:",
                error
            );


            removeTypingIndicator();


            /*
            Development-only error.
            */

            addMessage(
                "I couldn't connect to the Ore backend yet. The interface is ready, but the FastAPI backend still needs to be connected.",
                "ore"
            );

        } finally {

            isGenerating = false;

            updateSendButton();

        }

    }


    /*
    ================================================================
    SEND BUTTON
    ================================================================
    */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /*
    ================================================================
    ENTER TO SEND
    ================================================================
    */

    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /*
    ================================================================
    PROMPT CARDS
    ================================================================
    */

    document.querySelectorAll(
        ".prompt-card"
    ).forEach(card => {

        card.addEventListener(
            "click",
            () => {

                const prompt =
                    card.dataset.prompt;

                messageInput.value =
                    prompt;

                updateSendButton();

                messageInput.focus();

            }
        );

    });


    /*
    ================================================================
    NEW CHAT
    ================================================================
    */

    newChatButton.addEventListener(
        "click",
        () => {

            conversationStarted =
                false;

            messages.innerHTML =
                "";

            messages.classList.add(
                "hidden"
            );

            welcomeScreen.classList.remove(
                "hidden"
            );

            messageInput.value =
                "";

            messageInput.style.height =
                "auto";

            updateSendButton();

            closeSidebar();

        }
    );


    /*
    ================================================================
    MOBILE SIDEBAR
    ================================================================
    */

    function openSidebar() {

        sidebar.classList.add(
            "open"
        );

        sidebarOverlay.classList.add(
            "open"
        );

    }


    function closeSidebar() {

        sidebar.classList.remove(
            "open"
        );

        sidebarOverlay.classList.remove(
            "open"
        );

    }


    mobileMenu.addEventListener(
        "click",
        openSidebar
    );


    sidebarOverlay.addEventListener(
        "click",
        closeSidebar
    );


    /*
    ================================================================
    INITIAL STATE
    ================================================================
    */

    updateSendButton();

</script>

</body>
</html>
