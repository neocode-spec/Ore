<script>
    // =========================================================
    // ORE FRONTEND CONFIGURATION
    // =========================================================

    // Ore's brain lives on Render.
    // The website itself lives on Vercel.
    const ORE_BACKEND_URL = "https://ore-prime.onrender.com";

    const ORE_CHAT_ENDPOINT = `${ORE_BACKEND_URL}/api/chat`;

    // Maximum time we allow a request to wait.
    // Render may need a little time to wake up.
    const ORE_REQUEST_TIMEOUT = 120000; // 2 minutes


    // =========================================================
    // EXISTING ORE UI JAVASCRIPT
    // =========================================================

    const sidebar = document.getElementById('sidebar');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const openSidebarBtn = document.getElementById('open-sidebar-btn');

    if (closeSidebarBtn && sidebar && openSidebarBtn) {

        closeSidebarBtn.addEventListener('click', () => {
            sidebar.classList.add('collapsed');
            openSidebarBtn.style.display = 'flex';
        });

        openSidebarBtn.addEventListener('click', () => {
            sidebar.classList.remove('collapsed');
            openSidebarBtn.style.display = 'none';
        });

    }


    // =========================================================
    // CHAT / WORK MODE SWITCHER
    // =========================================================

    const chatModeBtn = document.getElementById('chat-mode-btn');
    const workModeBtn = document.getElementById('work-mode-btn');

    if (chatModeBtn && workModeBtn) {

        chatModeBtn.addEventListener('click', () => {
            chatModeBtn.classList.add('active');
            workModeBtn.classList.remove('active');
        });

        workModeBtn.addEventListener('click', () => {
            workModeBtn.classList.add('active');
            chatModeBtn.classList.remove('active');
        });

    }


    // =========================================================
    // LANGUAGE SWITCHER
    // =========================================================

    const langPidgin = document.getElementById('lang-pidgin');
    const langEnglish = document.getElementById('lang-english');

    let selectedLanguage = "pidgin";

    if (langPidgin && langEnglish) {

        langPidgin.addEventListener('click', () => {
            selectedLanguage = "pidgin";

            langPidgin.classList.add('active');
            langEnglish.classList.remove('active');
        });

        langEnglish.addEventListener('click', () => {
            selectedLanguage = "english";

            langEnglish.classList.add('active');
            langPidgin.classList.remove('active');
        });

    }


    // =========================================================
    // THINK TOGGLE
    // =========================================================

    const thinkBtn = document.getElementById('think-btn');

    if (thinkBtn) {
        thinkBtn.addEventListener('click', () => {
            thinkBtn.classList.toggle('active');
        });
    }


    // =========================================================
    // QUICK PROMPT
    // =========================================================

    function quickPrompt(text) {

        const chatInput = document.getElementById('chat-input');

        if (!chatInput) {
            return;
        }

        chatInput.value = text;
        chatInput.focus();

        // Trigger textarea resizing.
        chatInput.dispatchEvent(new Event('input'));

    }


    // Make quickPrompt available to HTML buttons.
    window.quickPrompt = quickPrompt;


    // =========================================================
    // CHAT ELEMENTS
    // =========================================================

    const chatInput = document.getElementById('chat-input');
    const centerContainer = document.querySelector('.center-container');
    const chatBar = document.querySelector('.pixel-chat-bar');

    let isGenerating = false;


    // =========================================================
    // ORE CHAT STYLES
    // =========================================================

    const oreChatStyles = document.createElement('style');

    oreChatStyles.textContent = `

        #ore-conversation {
            width: 100%;
            max-width: 768px;
            height: 100%;
            overflow-y: auto;
            padding: 20px 20px 160px;
            display: none;
            flex-direction: column;
            gap: 24px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .ore-message {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
        }

        .ore-message-user {
            align-items: flex-end;
        }

        .ore-message-ore {
            align-items: flex-start;
        }

        .ore-message-label {
            font-size: 12px;
            color: #777777;
            padding: 0 4px;
        }

        .ore-user-bubble {
            max-width: 80%;
            background: #1c1c1e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 11px 15px;
            color: #ffffff;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .ore-response {
            width: 100%;
            color: #ececec;
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .ore-thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 34px;
            padding: 0 4px;
        }

        .ore-diamond {
            width: 22px;
            height: 22px;
            position: relative;
            transform: rotate(45deg);
            animation: oreDiamondPulse 1.1s ease-in-out infinite;
            flex-shrink: 0;
        }

        .ore-diamond-inner {
            position: absolute;
            inset: 0;
            border: 2px solid #00ff66;
            background: linear-gradient(
                135deg,
                #d9ffe9 0%,
                #00ff66 35%,
                #00b84a 70%,
                #005225 100%
            );
            box-shadow:
                0 0 8px rgba(0,255,102,0.65),
                0 0 18px rgba(0,255,102,0.25);
        }

        .ore-diamond-inner::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background: rgba(255,255,255,0.75);
        }

        .ore-diamond-inner::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.65);
        }

        .ore-thinking-text {
            color: #8e8e8e;
            font-size: 13px;
        }

        .ore-cursor {
            display: inline-block;
            width: 2px;
            height: 17px;
            margin-left: 3px;
            vertical-align: -3px;
            background: #00ff66;
            animation: oreCursorBlink 0.8s step-end infinite;
        }

        .ore-error {
            color: #ff7777;
        }

        @keyframes oreDiamondPulse {

            0%, 100% {
                opacity: 0.35;
                transform: rotate(45deg) scale(0.88);
                filter: brightness(0.75);
            }

            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.08);
                filter: brightness(1.35);
            }

        }

        @keyframes oreCursorBlink {

            0%, 45% {
                opacity: 1;
            }

            46%, 100% {
                opacity: 0;
            }

        }

        .ore-send-disabled {
            opacity: 0.5;
            pointer-events: none;
        }

    `;

    document.head.appendChild(oreChatStyles);


    // =========================================================
    // CREATE CONVERSATION AREA
    // =========================================================

    const conversation = document.createElement('div');

    conversation.id = 'ore-conversation';

    if (centerContainer && centerContainer.parentNode) {

        centerContainer.parentNode.insertBefore(
            conversation,
            centerContainer
        );

    }


    // =========================================================
    // CREATE ORE DIAMOND
    // =========================================================

    function createOreDiamond() {

        const diamond = document.createElement('div');

        diamond.className = 'ore-diamond';

        diamond.innerHTML = `
            <div class="ore-diamond-inner"></div>
        `;

        return diamond;

    }


    // =========================================================
    // SHOW THINKING
    // =========================================================

    function showThinking() {

        removeThinking();

        const thinking = document.createElement('div');

        thinking.className =
            'ore-message ore-message-ore';

        thinking.id =
            'ore-thinking-message';

        const thinkingRow =
            document.createElement('div');

        thinkingRow.className =
            'ore-thinking';

        const diamond =
            createOreDiamond();

        const text =
            document.createElement('span');

        text.className =
            'ore-thinking-text';

        text.textContent =
            'Ore is thinking...';

        thinkingRow.appendChild(diamond);
        thinkingRow.appendChild(text);

        thinking.appendChild(thinkingRow);

        conversation.appendChild(thinking);

        conversation.scrollTop =
            conversation.scrollHeight;

        return thinking;

    }


    // =========================================================
    // REMOVE THINKING
    // =========================================================

    function removeThinking() {

        const thinking =
            document.getElementById(
                'ore-thinking-message'
            );

        if (thinking) {
            thinking.remove();
        }

    }


    // =========================================================
    // ADD USER MESSAGE
    // =========================================================

    function addUserMessage(message) {

        const wrapper =
            document.createElement('div');

        wrapper.className =
            'ore-message ore-message-user';

        const label =
            document.createElement('div');

        label.className =
            'ore-message-label';

        label.textContent =
            'You';

        const bubble =
            document.createElement('div');

        bubble.className =
            'ore-user-bubble';

        bubble.textContent =
            message;

        wrapper.appendChild(label);
        wrapper.appendChild(bubble);

        conversation.appendChild(wrapper);

        conversation.scrollTop =
            conversation.scrollHeight;

    }


    // =========================================================
    // TYPE ORE RESPONSE
    // =========================================================

    async function typeOreResponse(response) {

        const wrapper =
            document.createElement('div');

        wrapper.className =
            'ore-message ore-message-ore';

        const label =
            document.createElement('div');

        label.className =
            'ore-message-label';

        label.textContent =
            'Ore';

        const responseBox =
            document.createElement('div');

        responseBox.className =
            'ore-response';

        wrapper.appendChild(label);
        wrapper.appendChild(responseBox);

        conversation.appendChild(wrapper);

        const cursor =
            document.createElement('span');

        cursor.className =
            'ore-cursor';

        responseBox.appendChild(cursor);


        for (
            let i = 0;
            i < response.length;
            i++
        ) {

            cursor.remove();

            responseBox.textContent +=
                response[i];

            responseBox.appendChild(cursor);

            conversation.scrollTop =
                conversation.scrollHeight;


            let delay = 12;

            if (
                response[i] === "." ||
                response[i] === "," ||
                response[i] === "!" ||
                response[i] === "?"
            ) {
                delay = 55;
            }

            if (response[i] === "\n") {
                delay = 35;
            }

            await new Promise(
                resolve =>
                    setTimeout(resolve, delay)
            );

        }

        cursor.remove();

        conversation.scrollTop =
            conversation.scrollHeight;

    }


    // =========================================================
    // FETCH ORE BACKEND
    // =========================================================

    async function askOreBackend(message) {

        const controller =
            new AbortController();

        const timeout =
            setTimeout(() => {
                controller.abort();
            }, ORE_REQUEST_TIMEOUT);


        try {

            console.log(
                "ORE → Backend:",
                ORE_CHAT_ENDPOINT
            );

            console.log(
                "ORE → Payload:",
                {
                    message: message,
                    language: selectedLanguage
                }
            );


            const response =
                await fetch(
                    ORE_CHAT_ENDPOINT,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json',

                            'Accept':
                                'application/json'
                        },

                        body: JSON.stringify({
                            message: message,
                            language: selectedLanguage
                        }),

                        signal:
                            controller.signal
                    }
                );


            console.log(
                "ORE ← Status:",
                response.status
            );


            if (!response.ok) {

                let errorText = "";

                try {
                    errorText =
                        await response.text();
                } catch (_) {
                    errorText = "";
                }

                throw new Error(
                    `Backend returned ${response.status}` +
                    (
                        errorText
                            ? `: ${errorText.substring(0, 300)}`
                            : ""
                    )
                );

            }


            const data =
                await response.json();


            console.log(
                "ORE ← Response:",
                data
            );


            /*
             * Expected backend response:
             *
             * {
             *     "response": "Ore's answer"
             * }
             *
             */

            if (
                typeof data === "string"
            ) {
                return data;
            }


            if (
                data &&
                typeof data.response === "string"
            ) {
                return data.response;
            }


            // Some backends use "message" instead.
            if (
                data &&
                typeof data.message === "string"
            ) {
                return data.message;
            }


            throw new Error(
                "Backend responded, but no response text was found."
            );

        } finally {

            clearTimeout(timeout);

        }

    }


    // =========================================================
    // SEND MESSAGE
    // =========================================================

    async function sendMessage() {

        if (isGenerating) {
            return;
        }


        if (!chatInput || !conversation) {
            console.error(
                "ORE: Chat elements not found."
            );
            return;
        }


        const message =
            chatInput.value.trim();


        if (!message) {
            return;
        }


        isGenerating = true;


        // -----------------------------------------------------
        // SHOW CHAT
        // -----------------------------------------------------

        if (centerContainer) {
            centerContainer.style.display =
                'none';
        }

        conversation.style.display =
            'flex';


        // -----------------------------------------------------
        // USER MESSAGE
        // -----------------------------------------------------

        addUserMessage(message);


        // -----------------------------------------------------
        // CLEAR INPUT
        // -----------------------------------------------------

        chatInput.value = '';

        chatInput.style.height =
            'auto';


        // -----------------------------------------------------
        // THINKING
        // -----------------------------------------------------

        showThinking();


        try {

            // -------------------------------------------------
            // ACTUAL CONNECTION TO RENDER
            // -------------------------------------------------

            const oreResponse =
                await askOreBackend(message);


            // -------------------------------------------------
            // REMOVE THINKING DIAMOND
            // -------------------------------------------------

            removeThinking();


            // -------------------------------------------------
            // TYPE RESPONSE
            // -------------------------------------------------

            await typeOreResponse(
                oreResponse ||
                "Ore no get response for that one yet."
            );


        } catch (error) {

            console.error(
                "ORE ERROR:",
                error
            );


            removeThinking();


            let errorMessage =
                "I no fit connect to Ore backend right now.";


            if (
                error.name ===
                "AbortError"
            ) {

                errorMessage =
                    "Ore backend took too long to respond. Render may still be waking up.";

            } else if (
                error.message &&
                error.message.includes("Failed to fetch")
            ) {

                errorMessage =
                    "Ore backend could not be reached. Check the Render service and CORS settings.";

            } else if (
                error.message
            ) {

                console.error(
                    "ORE BACKEND DETAIL:",
                    error.message
                );

            }


            const wrapper =
                document.createElement('div');

            wrapper.className =
                'ore-message ore-message-ore';


            const label =
                document.createElement('div');

            label.className =
                'ore-message-label';

            label.textContent =
                'Ore';


            const responseBox =
                document.createElement('div');

            responseBox.className =
                'ore-response ore-error';

            responseBox.textContent =
                errorMessage;


            wrapper.appendChild(label);
            wrapper.appendChild(responseBox);

            conversation.appendChild(wrapper);


            conversation.scrollTop =
                conversation.scrollHeight;

        } finally {

            isGenerating = false;

            chatInput.focus();

        }

    }


    // =========================================================
    // ENTER TO SEND
    // SHIFT + ENTER = NEW LINE
    // =========================================================

    if (chatInput) {

        chatInput.addEventListener(
            'keydown',
            (event) => {

                if (
                    event.key === 'Enter' &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        // -----------------------------------------------------
        // AUTO GROW TEXTAREA
        // -----------------------------------------------------

        chatInput.addEventListener(
            'input',
            () => {

                chatInput.style.height =
                    'auto';

                chatInput.style.height =
                    Math.min(
                        chatInput.scrollHeight,
                        180
                    ) + 'px';

            }
        );


        // -----------------------------------------------------
        // SHIFT + ENTER RESIZE
        // -----------------------------------------------------

        chatInput.addEventListener(
            'keyup',
            (event) => {

                if (
                    event.key === 'Enter' &&
                    event.shiftKey
                ) {

                    chatInput.style.height =
                        'auto';

                    chatInput.style.height =
                        Math.min(
                            chatInput.scrollHeight,
                            180
                        ) + 'px';

                }

            }
        );

    }


    // =========================================================
    // EXPOSE SEND FUNCTION
    // =========================================================

    window.sendMessage =
        sendMessage;


    // =========================================================
    // ORE CONNECTION TEST
    // =========================================================

    console.log(
        "================================="
    );

    console.log(
        "ORE FRONTEND INITIALIZED"
    );

    console.log(
        "Frontend: Vercel"
    );

    console.log(
        "Backend:",
        ORE_BACKEND_URL
    );

    console.log(
        "Chat endpoint:",
        ORE_CHAT_ENDPOINT
    );

    console.log(
        "================================="
    );

</script>
