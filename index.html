<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore</title>

<link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L2 12l10 10 10-10L12 2z' fill='%2300ff66'/%3E%3C/svg%3E"
>

<script src="https://cdn.tailwindcss.com"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #000000;
    color: #ececec;
    font-family: Söhne, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    user-select: none;
}

body {
    overflow: hidden;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 5px;
    height: 5px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: #2a2a2a;
    border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
    background: #3e3e3e;
}

/* App Layout */
#app {
    width: 100%;
    height: 100%;
    display: flex;
    overflow: hidden;
    background: #000000;
    position: relative;
}

/* Sidebar */
#sidebar {
    width: 260px;
    height: 100%;
    flex-shrink: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

#sidebar.collapsed {
    margin-left: -260px;
}

.sidebar-inner {
    width: 260px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
}

/* Sidebar Top Header */
.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px 12px;
}

.brand-title {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9b9b9b;
    transition: background 0.15s ease, color 0.15s ease;
    cursor: pointer;
}

.icon-btn:hover {
    background: #171717;
    color: #ffffff;
}

/* Sidebar Navigation */
.nav-section {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.nav-item {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #ececec;
    font-size: 14px;
    font-weight: 400;
    transition: background 0.15s ease;
    cursor: pointer;
}

.nav-item:hover {
    background: #171717;
}

.badge-updated {
    background: #262626;
    color: #b4b4b4;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.02em;
}

.section-divider {
    padding: 16px 10px 6px;
    font-size: 12px;
    font-weight: 600;
    color: #666666;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Sidebar Bottom */
.sidebar-bottom {
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.claim-offer-btn {
    width: 100%;
    height: 36px;
    border-radius: 18px;
    background: #171717;
    color: #ececec;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: background 0.15s ease;
    cursor: pointer;
}

.claim-offer-btn:hover {
    background: #222222;
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
}

.user-profile:hover {
    background: #171717;
}

.user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ab47bc;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
}

.user-info {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
}

.user-name {
    font-size: 13px;
    font-weight: 500;
    color: #ffffff;
}

.user-plan {
    font-size: 11px;
    color: #8e8e8e;
}

/* Main Workspace */
#main {
    flex: 1;
    height: 100%;
    background: #000000;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* Floating Toggle Button for Collapsed Sidebar */
#open-sidebar-btn {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 50;
    display: none;
    background: #171717;
    border: 1px solid rgba(255,255,255,0.1);
}

/* Top Nav Bar */
.top-nav-bar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 16px;
    flex-shrink: 0;
}

.mode-pill {
    background: #171717;
    border-radius: 20px;
    padding: 3px;
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.pill-btn {
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: #8e8e8e;
    transition: all 0.15s ease;
    cursor: pointer;
}

.pill-btn.active {
    background: #262626;
    color: #ffffff;
}

.top-right-offer {
    position: absolute;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.free-offer-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ececec;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}

/* Center Hero Screen */
.center-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 40px;
}

.hero-title {
    font-size: 30px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 28px;
    letter-spacing: -0.01em;
}

/* Chat Input Bar Outer Container */
.pixel-chat-bar {
    width: 100%;
    background: #1c1c1e;
    border-radius: 32px;
    padding: 12px 18px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: border-color 0.2s ease;
}

.pixel-chat-bar:focus-within {
    border-color: rgba(255, 255, 255, 0.22);
}

.chat-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 16px;
    resize: none;
    min-height: 28px;
    max-height: 180px;
}

.chat-input::placeholder {
    color: #8e8e8e;
}

/* Controls Toolbar Inside Chat Bar */
.pixel-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
}

.toolbar-left, .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.pixel-icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2c2c2e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e3e3e3;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
}

.pixel-icon-btn:hover {
    background: #3a3a3c;
    transform: scale(1.04);
}

.pixel-pill-btn {
    height: 36px;
    padding: 0 14px;
    border-radius: 18px;
    background: #2c2c2e;
    color: #e3e3e3;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    border: 1px solid transparent;
}

.pixel-pill-btn:hover {
    background: #3a3a3c;
}

.pixel-pill-btn.active {
    background: #3a3a3c;
    border-color: #00ff66;
    color: #ffffff;
}

/* Voice Call Sphere Button */
.voice-sphere-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2997ff;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
}

.voice-sphere-btn:hover {
    transform: scale(1.06);
    background: #007aff;
}

/* Language Switcher Bar */
.lang-toggle-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 24px;
}

.lang-btn {
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 14px;
    color: #8e8e8e;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: all 0.15s ease;
}

.lang-btn.active {
    background: #00ff66;
    color: #000000;
    font-weight: 600;
    border-color: #00ff66;
}

/* Dynamic State Overrides when Chat is active */
body.chat-active .hero-title,
body.chat-active .lang-toggle-bar {
    display: none;
}

body.chat-active .center-container {
    flex: none;
    padding-bottom: 20px;
    justify-content: flex-end;
}
</style>
</head>

<body>

<div id="app">

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="sidebar-inner">
            
            <div class="sidebar-header">
                <div class="brand-title">
                    <!-- Perfect Green Diamond Logo -->
                    <svg viewBox="0 0 24 24" class="w-5 h-5">
                        <path d="M12 2L2 12l10 10 10-10L12 2z" fill="#00ff66"/>
                    </svg>
                    Ore
                </div>
                <div class="flex items-center gap-1">
                    <button class="icon-btn" title="Search chats">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </button>
                    <button class="icon-btn" id="close-sidebar-btn" title="Close sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
                    </button>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    New chat
                </div>
                
                <div class="nav-item justify-between">
                    <div class="flex items-center gap-3">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        Images
                    </div>
                    <span class="badge-updated">UPDATED</span>
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14M12 6v14M8 6l-4 14M12 2v4"/></svg>
                    Library
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Scheduled
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l5.58-5.58c.94-.94.94-2.48 0-3.42L12 2Z"/><circle cx="7" cy="7" r="1.5"/></svg>
                    Plugins
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.9 2.5H4a2 2 0 0 0-2 2v13.5a2 2 0 0 0 2 2h16z"/></svg>
                    Projects
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Codex
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                    More
                </div>

                <div class="section-divider">Pinned</div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Assignment Help
                </div>

                <div class="section-divider">
                    <span>Recents</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </div>
            </div>

            <div class="sidebar-bottom">
                <button class="claim-offer-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 5v3M7 8s0-3 2.5-3c2 0 2.5 3 2.5 3M17 8s0-3-2.5-3c-2 0-2.5 3-2.5 3"/></svg>
                    Claim offer
                </button>

                <div class="user-profile">
                    <div class="user-avatar">M</div>
                    <div class="user-info">
                        <span class="user-name">Murphy</span>
                        <span class="user-plan">Free</span>
                    </div>
                </div>
            </div>

        </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main id="main">

        <!-- Sidebar Floating Toggle Button -->
        <button id="open-sidebar-btn" class="icon-btn" title="Open sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>

        <!-- Top Nav Bar -->
        <div class="top-nav-bar">
            <div class="mode-pill">
                <button class="pill-btn active" id="chat-mode-btn">Chat</button>
                <button class="pill-btn flex items-center gap-1" id="work-mode-btn">
                    <span style="color:#00ff66;">✦</span> Work
                </button>
            </div>

            <div class="top-right-offer">
                <button class="free-offer-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 5v3"/></svg>
                    Free offer
                </button>
                <button class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
            </div>
        </div>

        <!-- Center Main Container -->
        <div class="center-container">
            <h1 class="hero-title">How can I help, Murphy?</h1>

            <!-- Search & Chat Input Box -->
            <div class="pixel-chat-bar">
                <textarea class="chat-input" id="chat-input" placeholder="Ask anything" rows="1"></textarea>
                
                <div class="pixel-toolbar">
                    <div class="toolbar-left">
                        <!-- Attach Plus Button -->
                        <button class="pixel-icon-btn" title="Add attachment">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                    </div>

                    <div class="toolbar-right">
                        <!-- Search Web Button with Star -->
                        <button class="pixel-pill-btn" id="search-web-btn" onclick="quickPrompt('Search the web for ')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            <span style="color:#00ff66; font-size:12px;">✦</span> Search
                        </button>

                        <!-- Think / Brain Pill Button -->
                        <button class="pixel-pill-btn" id="think-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04Z"/></svg>
                            Think
                        </button>

                        <!-- Mic Button -->
                        <button class="pixel-icon-btn" title="Voice Input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </button>

                        <!-- Google Lens Camera Icon -->
                        <button class="pixel-icon-btn" title="Camera Search">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        </button>

                        <!-- Voice Sphere Button -->
                        <button class="voice-sphere-btn" title="Live Voice Mode">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10v4M6 6v12M10 3v18M14 8v8M18 5v14M22 10v4"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Language Switcher Bar -->
            <div class="lang-toggle-bar">
                <button class="lang-btn active" id="lang-pidgin">Pidgin</button>
                <button class="lang-btn" id="lang-english">English</button>
            </div>

        </div>

    </main>

</div>

<script>
    // =========================================================
    // UI NAVIGATION & INTERACTION LOGIC
    // =========================================================

    const sidebar = document.getElementById('sidebar');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const openSidebarBtn = document.getElementById('open-sidebar-btn');

    closeSidebarBtn.addEventListener('click', () => {
        sidebar.classList.add('collapsed');
        openSidebarBtn.style.display = 'flex';
    });

    openSidebarBtn.addEventListener('click', () => {
        sidebar.classList.remove('collapsed');
        openSidebarBtn.style.display = 'none';
    });

    const chatModeBtn = document.getElementById('chat-mode-btn');
    const workModeBtn = document.getElementById('work-mode-btn');

    chatModeBtn.addEventListener('click', () => {
        chatModeBtn.classList.add('active');
        workModeBtn.classList.remove('active');
    });

    workModeBtn.addEventListener('click', () => {
        workModeBtn.classList.add('active');
        chatModeBtn.classList.remove('active');
    });

    const thinkBtn = document.getElementById('think-btn');
    thinkBtn.addEventListener('click', () => {
        thinkBtn.classList.toggle('active');
    });

    function quickPrompt(text) {
        const chatInput = document.getElementById('chat-input');
        chatInput.value = text;
        chatInput.focus();
    }


    // =========================================================
    // ORE CHAT SYSTEM - INTEGRATED SYSTEM
    // =========================================================

    const chatInput = document.getElementById('chat-input');
    const centerContainer = document.querySelector('.center-container');
    const mainWorkspace = document.getElementById('main');
    const langPidgin = document.getElementById('lang-pidgin');
    const langEnglish = document.getElementById('lang-english');

    let selectedLanguage = "pidgin";
    let isGenerating = false;

    // Language Selection listeners
    langPidgin.addEventListener('click', () => {
        langPidgin.classList.add('active');
        langEnglish.classList.remove('active');
        selectedLanguage = "pidgin";
    });

    langEnglish.addEventListener('click', () => {
        langEnglish.classList.add('active');
        langPidgin.classList.remove('active');
        selectedLanguage = "english";
    });

    // Dynamic Style Injection for Chat Stream & Diamond Animation
    const oreChatStyles = document.createElement('style');
    oreChatStyles.textContent = `
        #ore-conversation {
            width: 100%;
            max-width: 768px;
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 20px;
            display: none;
            flex-direction: column;
            gap: 24px;
            margin: 0 auto;
        }

        .ore-message {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ore-message-user {
            align-items: flex-end;
        }

        .ore-message-ore {
            align-items: flex-start;
        }

        .ore-message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .ore-message-label {
            font-size: 13px;
            font-weight: 600;
            color: #00ff66;
        }

        .ore-message-label-user {
            font-size: 12px;
            color: #777777;
            padding: 0 4px;
        }

        .ore-user-bubble {
            max-width: 80%;
            background: #1c1c1e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 11px 15px;
            color: #ffffff;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ore-response {
            width: 100%;
            color: #ececec;
            font-size: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 0 4px;
        }

        .ore-diamond {
            width: 18px;
            height: 18px;
            position: relative;
            transform: rotate(45deg);
            animation: oreDiamondPulse 1.1s ease-in-out infinite;
            display: inline-block;
        }

        .ore-diamond-inner {
            position: absolute;
            inset: 0;
            border: 2px solid #00ff66;
            background: linear-gradient(
                135deg,
                #d9ffe9 0%,
                #00ff66 35%,
                #00b84a 70%,
                #005225 100%
            );
            box-shadow:
                0 0 8px rgba(0,255,102,0.65),
                0 0 18px rgba(0,255,102,0.25);
        }

        .ore-diamond-inner::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background: rgba(255,255,255,0.75);
        }

        .ore-diamond-inner::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.65);
        }

        .ore-thinking-text {
            color: #8e8e8e;
            font-size: 14px;
            font-style: italic;
        }

        .ore-cursor {
            display: inline-block;
            width: 2px;
            height: 17px;
            margin-left: 3px;
            vertical-align: -3px;
            background: #00ff66;
            animation: oreCursorBlink 0.8s step-end infinite;
        }

        @keyframes oreDiamondPulse {
            0%, 100% {
                opacity: 0.45;
                transform: rotate(45deg) scale(0.9);
                filter: brightness(0.85);
            }
            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.1);
                filter: brightness(1.35);
            }
        }

        @keyframes oreCursorBlink {
            0%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }
    `;
    document.head.appendChild(oreChatStyles);

    // Create Conversation Scroll Container
    const conversation = document.createElement('div');
    conversation.id = 'ore-conversation';
    mainWorkspace.insertBefore(conversation, centerContainer);

    // Create Animated Diamond Element
    function createOreDiamond() {
        const diamond = document.createElement('div');
        diamond.className = 'ore-diamond';
        diamond.innerHTML = `<div class="ore-diamond-inner"></div>`;
        return diamond;
    }

    // Display Thinking Indicator with Blinking Diamond
    function showThinking() {
        const wrapper = document.createElement('div');
        wrapper.className = 'ore-message ore-message-ore';
        wrapper.id = 'ore-current-response';

        const header = document.createElement('div');
        header.className = 'ore-message-header';

        const diamond = createOreDiamond();
        const label = document.createElement('span');
        label.className = 'ore-message-label';
        label.textContent = 'Ore';

        header.appendChild(diamond);
        header.appendChild(label);

        const responseBox = document.createElement('div');
        responseBox.className = 'ore-response';

        const thinkingText = document.createElement('span');
        thinkingText.className = 'ore-thinking-text';
        thinkingText.textContent = 'thinking...';

        responseBox.appendChild(thinkingText);

        wrapper.appendChild(header);
        wrapper.appendChild(responseBox);

        conversation.appendChild(wrapper);
        conversation.scrollTop = conversation.scrollHeight;

        return wrapper;
    }

    // Add User Message Bubble
    function addUserMessage(message) {
        const wrapper = document.createElement('div');
        wrapper.className = 'ore-message ore-message-user';

        const label = document.createElement('div');
        label.className = 'ore-message-label-user';
        label.textContent = 'You';

        const bubble = document.createElement('div');
        bubble.className = 'ore-user-bubble';
        bubble.textContent = message;

        wrapper.appendChild(label);
        wrapper.appendChild(bubble);

        conversation.appendChild(wrapper);
        conversation.scrollTop = conversation.scrollHeight;
    }

    // Type Ore Response (Retaining the Diamond in the header throughout)
    async function typeOreResponse(response) {
        const currentMsg = document.getElementById('ore-current-response');
        let responseBox;

        if (currentMsg) {
            responseBox = currentMsg.querySelector('.ore-response');
            responseBox.innerHTML = ''; // Clear "thinking..." text while preserving diamond header
            currentMsg.removeAttribute('id');
        } else {
            const wrapper = document.createElement('div');
            wrapper.className = 'ore-message ore-message-ore';

            const header = document.createElement('div');
            header.className = 'ore-message-header';

            const diamond = createOreDiamond();
            const label = document.createElement('span');
            label.className = 'ore-message-label';
            label.textContent = 'Ore';

            header.appendChild(diamond);
            header.appendChild(label);

            responseBox = document.createElement('div');
            responseBox.className = 'ore-response';

            wrapper.appendChild(header);
            wrapper.appendChild(responseBox);
            conversation.appendChild(wrapper);
        }

        const cursor = document.createElement('span');
        cursor.className = 'ore-cursor';
        responseBox.appendChild(cursor);

        for (let i = 0; i < response.length; i++) {
            cursor.remove();
            responseBox.textContent += response[i];
            responseBox.appendChild(cursor);
            conversation.scrollTop = conversation.scrollHeight;

            let delay = 12;
            if (['.', ',', '!', '?'].includes(response[i])) {
                delay = 55;
            } else if (response[i] === '\n') {
                delay = 35;
            }

            await new Promise(resolve => setTimeout(resolve, delay));
        }

        cursor.remove();
        conversation.scrollTop = conversation.scrollHeight;
    }

    // Send Message Handler
    async function sendMessage() {
        if (isGenerating) return;

        const message = chatInput.value.trim();
        if (!message) return;

        isGenerating = true;

        // Transition layout to Active Chat
        document.body.classList.add('chat-active');
        conversation.style.display = 'flex';

        // Append user prompt
        addUserMessage(message);

        // Reset input box
        chatInput.value = '';
        chatInput.style.height = 'auto';

        // Show blinking diamond thinking state
        showThinking();

        try {
            const response = await fetch('https://ore-prime.onrender.com/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: message,
                    language: selectedLanguage
                })
            });

            if (!response.ok) {
                throw new Error(`Ore backend returned ${response.status}`);
            }

            const data = await response.json();
            const oreResponse = data.response || "I no get response for that one yet.";

            // Stream response text alongside the diamond
            await typeOreResponse(oreResponse);

        } catch (error) {
            console.error("ORE ERROR:", error);
            await typeOreResponse("I no fit connect to Ore backend right now.");
        } finally {
            isGenerating = false;
            chatInput.focus();
        }
    }

    // Keyboard Listeners
    chatInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 180) + 'px';
    });
</script>

</body>
</html>
