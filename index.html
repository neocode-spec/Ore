* {

html,
body {
    width: 100%;

}

body {
    overflow: hidden;
}

/* ============================================================
   SCROLLBAR
============================================================ */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: #555;
}


/* ============================================================
   APP
============================================================ */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    overflow: hidden;
}


/* ============================================================
   SIDEBAR
============================================================ */

#sidebar {
    width: 260px;
    height: 100%;
    flex-shrink: 0;
    background: #171717;
    display: flex;
    flex-direction: column;
    transition:
        width 0.2s ease,
        transform 0.25s ease;
    overflow: hidden;
}

#sidebar.collapsed {
    width: 0;
}

.sidebar-inner {
    width: 260px;
    height: 100%;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}


/* ============================================================
   SIDEBAR TOP
============================================================ */

.sidebar-top {
    padding: 12px;
}

.sidebar-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.sidebar-icon-button {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b4b4b4;
    transition: background 0.15s ease, color 0.15s ease;
}

.sidebar-icon-button:hover {
    background: #2a2a2a;
    color: #fff;
}


/* ============================================================
   ORE LOGO
============================================================ */

.ore-logo {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
}

.ore-logo-large {
    width: 64px;
    height: 64px;
}


/* ============================================================
   NEW CHAT
============================================================ */

.new-chat {
    margin-top: 8px;
    width: 100%;
    height: 42px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 12px;
    color: #ececec;
    font-size: 14px;
    transition: background 0.15s ease;
}

.new-chat:hover {
    background: #2a2a2a;
}


/* ============================================================
   SIDEBAR SEARCH
============================================================ */

.sidebar-search {
    width: 100%;
    height: 40px;
    margin-top: 3px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 12px;
    color: #b4b4b4;
    font-size: 14px;
}

.sidebar-search:hover {
    background: #2a2a2a;
    color: #fff;
}


/* ============================================================
   HISTORY
============================================================ */

.history {
    flex: 1;
    overflow-y: auto;
    padding: 18px 8px;
}

.history-label {
    padding: 0 10px 8px;
    font-size: 12px;
    color: #8e8e8e;
}

.history-item {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    color: #d1d1d1;
    font-size: 13px;
    text-align: left;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #2a2a2a;
}

.history-item.active {
    background: #2a2a2a;
}


/* ============================================================
   SIDEBAR BOTTOM
============================================================ */

.sidebar-bottom {
    padding: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
}

.account-button {
    width: 100%;
    padding: 8px 9px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
}

.account-button:hover {
    background: #2a2a2a;
}

.avatar {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
}


/* ============================================================
   MAIN
============================================================ */

#main {
    min-width: 0;
    min-height: 0;
    flex: 1;
    height: 100%;
    background: #212121;
    position: relative;
    display: flex;
    flex-direction: column;
}


/* ============================================================
   HEADER
============================================================ */

#header {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
    z-index: 10;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 6px;
}

.header-button {
    height: 36px;
    padding: 0 9px;
    border-radius: 8px;
    color: #b4b4b4;
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-button:hover {
    background: #2a2a2a;
    color: #fff;
}

.mobile-menu-button {
    display: none;
}


/* ============================================================
   CHAT AREA
============================================================ */

#chat-container {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    position: relative;
}

#welcome-screen {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px 190px;
}

.welcome-content {
    width: 100%;
    max-width: 768px;
    text-align: center;
}

.welcome-title {
    font-size: 30px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.025em;
}

.welcome-subtitle {
    margin-top: 12px;
    color: #9b9b9b;
    font-size: 15px;
}


/* ============================================================
   PROMPT CARDS
============================================================ */

.prompt-grid {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.prompt-card {
    padding: 14px 15px;
    min-height: 76px;
    text-align: left;
    border: 1px solid #3a3a3a;
    border-radius: 12px;
    background: #2a2a2a;
    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.prompt-card:hover {
    background: #303030;
    border-color: #555;
}

.prompt-title {
    font-size: 14px;
    color: #ececec;
}

.prompt-description {
    margin-top: 5px;
    color: #929292;
    font-size: 12px;
}


/* ============================================================
   MESSAGES
============================================================ */

#messages {
    width: 100%;
    padding-bottom: 170px;
}

.message-row {
    width: 100%;
}

.message-inner {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    padding: 18px 20px;
}

.user-message {
    display: flex;
    justify-content: flex-end;
}

.user-bubble {
    max-width: 70%;
    background: #2f2f2f;
    border-radius: 18px;
    padding: 10px 15px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.ore-message {
    display: flex;
    gap: 13px;
    align-items: flex-start;
}

.ore-avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    margin-top: 1px;
}

.ore-content {
    min-width: 0;
    flex: 1;
    color: #ececec;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}


/* ============================================================
   TYPING
============================================================ */

.typing-dots {
    display: flex;
    gap: 4px;
    padding-top: 7px;
}

.typing-dots span {
    width: 5px;
    height: 5px;
    background: #aaa;
    border-radius: 50%;
    animation: typing 1.2s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing-dots span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-2px);
    }
}


/* ============================================================
   COMPOSER
============================================================ */

#composer-area {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 20px 20px;
    pointer-events: none;
    background:
        linear-gradient(
            to bottom,
            rgba(33,33,33,0),
            rgba(33,33,33,0.92) 25%,
            #212121 48%
        );
}

#composer {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
    pointer-events: auto;
}

.composer-box {
    background: #2f2f2f;
    border: 1px solid #424242;
    border-radius: 16px;
    padding: 10px 12px 9px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.03);
}

#message-input {
    width: 100%;
    max-height: 180px;
    min-height: 26px;
    resize: none;
    overflow-y: auto;
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    padding: 3px 4px;
}

#message-input::placeholder {
    color: #8e8e8e;
}

.composer-bottom {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 5px;
}

.composer-left {
    display: flex;
    align-items: center;
    gap: 3px;
}

.tool-button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    color: #a8a8a8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tool-button:hover {
    background: #3b3b3b;
    color: #fff;
}

.tool-button.active {
    color: #00ff66;
}

.language-button {
    height: 32px;
    padding: 0 9px;
    border-radius: 8px;
    color: #a8a8a8;
    font-size: 12px;
}

.language-button:hover {
    background: #3b3b3b;
    color: #fff;
}

.language-button.active {
    background: #444;
    color: #fff;
}

.send-button {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
}

.send-button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.send-button:not(:disabled):hover {
    background: #ddd;
}

.disclaimer {
    text-align: center;
    color: #777;
    font-size: 11px;
    margin-top: 8px;
}


/* ============================================================
   SEARCH STATUS
============================================================ */

.search-status {
    display: none;
    margin: 0 auto 8px;
    max-width: 768px;
    color: #8e8e8e;
    font-size: 12px;
    padding-left: 5px;
}

.search-status.visible {
    display: block;
}


/* ============================================================
   MOBILE
============================================================ */

#sidebar-overlay {
    display: none;
}

@media (max-width: 768px) {

    #sidebar {
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        bottom: 0;
        width: 260px;
        transform: translateX(-100%);
        box-shadow: 15px 0 40px rgba(0,0,0,0.4);
    }

    #sidebar.open {
        transform: translateX(0);
    }

    #sidebar.collapsed {
        width: 260px;
    }

    #sidebar-overlay.open {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(0,0,0,0.55);
    }

    .mobile-menu-button {
        display: flex;
    }

    .desktop-sidebar-toggle {
        display: none;
    }

    .header-title {
        font-size: 14px;
    }

    #welcome-screen {
        align-items: flex-start;
        padding-top: 70px;
    }

    .welcome-title {
        font-size: 26px;
    }

    .welcome-subtitle {
        font-size: 14px;
    }

    .prompt-grid {
        grid-template-columns: 1fr;
    }

    .message-inner {
        padding: 15px 14px;
    }

    .user-bubble {
        max-width: 85%;
    }

    #composer-area {
        padding: 0 10px 10px;
    }

    .language-button {
        padding: 0 7px;
    }
}

@media (max-width: 420px) {

    .welcome-content {
        max-width: 100%;
    }

    .ore-logo-large {
        width: 52px;
        height: 52px;
    }

    .welcome-title {
        font-size: 24px;
    }

    .prompt-description {
        display: none;
    }

    .prompt-card {
        min-height: 52px;
    }

    .composer-box {
        border-radius: 15px;
    }
}

</style>

                                            d="M21 11.5L12.5 20C10.01 22.49 6 22.49 3.5 20C1.01 17.51 1.01 13.49 3.5 11L12.5 2C14.43 0.07 17.57 0.07 19.5 2C21.43 3.93 21.43 7.07 19.5 9L10 18.5C8.9 19.6 7.1 19.6 6 18.5C4.9 17.4 4.9 15.6 6 14.5L14.5 6"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        />

                                    </svg>

                                </button>


                                <!-- Web Search -->

                                <button
                                    id="search-button"
                                    class="tool-button"
                                    title="Search the web"
                                >

                                    <svg
                                        width="19"
                                        height="19"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                    >

                                        <circle
                                            cx="11"
                                            cy="11"
                                            r="6.5"
                                            stroke="currentColor"
                                            stroke-width="1.7"
                                        />

                                        <path
                                            d="M16 16L21 21"
                                            stroke="currentColor"
                                            stroke-width="1.7"
                                            stroke-linecap="round"
                                        />

                                    </svg>

                                </button>


                                <!-- Language -->

                                <button
                                    id="pidgin-button"
                                    class="language-button active"
                                >
                                    Pidgin
                                </button>

                                <button
                                    id="english-button"
                                    class="language-button"
                                >
                                    English
                                </button>

                            </div>


                            <!-- Send -->

                            <button
                                id="send-button"
                                class="send-button"
                                disabled
                                title="Send"
                            >

                                <svg
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                >

                                    <path
                                        d="M12 19V5"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                    />

                                    <path
                                        d="M6 11L12 5L18 11"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>


                    <div class="disclaimer">
                        Ore can make mistakes. Check important information.
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* ============================================================
   BACKEND
============================================================ */

/*
   When Render gives you the backend URL, put it here.

   Example:

   const API_URL =
       "https://ore-backend.onrender.com";

*/

const API_URL = "";


/* ============================================================
   STATE
============================================================ */

let currentLanguage = "pidgin";

let searchEnabled = false;

let conversationStarted = false;

let isGenerating = false;


/* ============================================================
   ELEMENTS
============================================================ */

const sidebar =
    document.getElementById("sidebar");

const sidebarOverlay =
    document.getElementById("sidebar-overlay");

const desktopSidebarToggle =
    document.getElementById(
        "desktop-sidebar-toggle"
    );

const openSidebarButton =
    document.getElementById(
        "open-sidebar-button"
    );

const mobileMenuButton =
    document.getElementById(
        "mobile-menu-button"
    );

const newChatButton =
    document.getElementById(
        "new-chat-button"
    );

const messageInput =
    document.getElementById(
        "message-input"
    );

const sendButton =
    document.getElementById(
        "send-button"
    );

const welcomeScreen =
    document.getElementById(
        "welcome-screen"
    );

const messages =
    document.getElementById(
        "messages"
    );

const chatContainer =
    document.getElementById(
        "chat-container"
    );

const pidginButton =
    document.getElementById(
        "pidgin-button"
    );

const englishButton =
    document.getElementById(
        "english-button"
    );

const searchButton =
    document.getElementById(
        "search-button"
    );

const searchStatus =
    document.getElementById(
        "search-status"
    );

const historyList =
    document.getElementById(
        "history-list"
    );

const emptyHistory =
    document.getElementById(
        "empty-history"
    );


/* ============================================================
   LOGO FUNCTION
============================================================ */

function createOreLogo() {

    const logo =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

    logo.setAttribute(
        "viewBox",
        "0 0 64 64"
    );

    logo.setAttribute(
        "class",
        "ore-avatar"
    );

    logo.innerHTML = `

        <path
            d="M32 3L61 32L32 61L3 32L32 3Z"
            stroke="#00FF66"
            stroke-width="5"
            fill="none"
        />

        <path
            d="M32 15L49 32L32 49L15 32L32 15Z"
            fill="#00FF66"
        />

    `;

    return logo;
}


/* ============================================================
   SEND BUTTON
============================================================ */

function updateSendButton() {

    const hasText =
        messageInput.value.trim().length > 0;

    sendButton.disabled =
        !hasText || isGenerating;
}


/* ============================================================
   AUTO GROW INPUT
============================================================ */

function resizeInput() {

    messageInput.style.height = "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            180
        ) + "px";
}


messageInput.addEventListener(
    "input",
    () => {

        resizeInput();

        updateSendButton();

    }
);


/* ============================================================
   LANGUAGE
============================================================ */

function setLanguage(language) {

    currentLanguage = language;

    if (language === "pidgin") {

        pidginButton.classList.add(
            "active"
        );

        englishButton.classList.remove(
            "active"
        );

    } else {

        englishButton.classList.add(
            "active"
        );

        pidginButton.classList.remove(
            "active"
        );

    }
}


pidginButton.addEventListener(
    "click",
    () => setLanguage("pidgin")
);


englishButton.addEventListener(
    "click",
    () => setLanguage("english")
);


/* ============================================================
   WEB SEARCH TOGGLE
============================================================ */

searchButton.addEventListener(
    "click",
    () => {

        searchEnabled =
            !searchEnabled;

        searchButton.classList.toggle(
            "active",
            searchEnabled
        );

        searchStatus.textContent =
            searchEnabled
                ? "Web search enabled"
                : "";

        searchStatus.classList.toggle(
            "visible",
            searchEnabled
        );

    }
);


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(text, role) {

    if (!conversationStarted) {

        conversationStarted = true;

        welcomeScreen.classList.add(
            "hidden"
        );

        messages.classList.remove(
            "hidden"
        );

    }


    const row =
        document.createElement("div");

    row.className =
        "message-row";


    const inner =
        document.createElement("div");

    inner.className =
        "message-inner";


    if (role === "user") {

        inner.classList.add(
            "user-message"
        );


        const bubble =
            document.createElement("div");

        bubble.className =
            "user-bubble";

        bubble.textContent =
            text;

        inner.appendChild(
            bubble
        );


    } else {

        inner.classList.add(
            "ore-message"
        );


        const logo =
            createOreLogo();


        const content =
            document.createElement("div");

        content.className =
            "ore-content";

        content.textContent =
            text;


        inner.appendChild(
            logo
        );

        inner.appendChild(
            content
        );

    }


    row.appendChild(
        inner
    );

    messages.appendChild(
        row
    );


    requestAnimationFrame(
        scrollToBottom
    );
}


/* ============================================================
   TYPING
============================================================ */

function addTypingIndicator() {

    const row =
        document.createElement("div");

    row.id =
        "typing-indicator";

    row.className =
        "message-row";


    const inner =
        document.createElement("div");

    inner.className =
        "message-inner ore-message";


    inner.appendChild(
        createOreLogo()
    );


    const dots =
        document.createElement("div");

    dots.className =
        "typing-dots";

    dots.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;


    inner.appendChild(
        dots
    );

    row.appendChild(
        inner
    );

    messages.appendChild(
        row
    );


    scrollToBottom();
}


function removeTypingIndicator() {

    const indicator =
        document.getElementById(
            "typing-indicator"
        );

    if (indicator) {
        indicator.remove();
    }
}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

    chatContainer.scrollTo({
        top: chatContainer.scrollHeight,
        behavior: "smooth"
    });

}


/* ============================================================
   HISTORY
============================================================ */

function addHistoryItem(title) {

    if (emptyHistory) {
        emptyHistory.remove();
    }


    const item =
        document.createElement("button");

    item.className =
        "history-item active";

    item.textContent =
        title.length > 38
            ? title.substring(0, 38) + "..."
            : title;


    historyList
        .querySelectorAll(".history-item")
        .forEach(
            existing => {
                existing.classList.remove(
                    "active"
                );
            }
        );


    historyList.prepend(
        item
    );
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const userMessage =
        messageInput.value.trim();


    if (
        !userMessage ||
        isGenerating
    ) {
        return;
    }


    addHistoryItem(
        userMessage
    );


    addMessage(
        userMessage,
        "user"
    );


    messageInput.value = "";

    messageInput.style.height =
        "auto";


    updateSendButton();


    isGenerating = true;

    updateSendButton();


    addTypingIndicator();


    if (searchEnabled) {

        searchStatus.textContent =
            "Searching the web...";

        searchStatus.classList.add(
            "visible"
        );

    }


    try {

        if (!API_URL) {

            throw new Error(
                "Ore backend URL is not configured."
            );

        }


        const response =
            await fetch(
                `${API_URL}/api/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            userMessage,

                        language:
                            currentLanguage,

                        search_enabled:
                            searchEnabled

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                `Backend returned ${response.status}`
            );

        }


        const data =
            await response.json();


        removeTypingIndicator();


        const oreResponse =
            data.response ||
            "Ore no return response.";


        addMessage(
            oreResponse,
            "ore"
        );


    } catch (error) {

        console.error(
            "Ore backend error:",
            error
        );


        removeTypingIndicator();


        addMessage(
            currentLanguage === "pidgin"
                ? "I no fit connect to Ore backend right now."
                : "I couldn't connect to the Ore backend right now.",
            "ore"
        );

    } finally {

        isGenerating = false;

        updateSendButton();

        if (!searchEnabled) {

            searchStatus.classList.remove(
                "visible"
            );

        }

    }
}


/* ============================================================
   SEND BUTTON
============================================================ */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ============================================================
   ENTER
============================================================ */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ============================================================
   PROMPT CARDS
============================================================ */

document
    .querySelectorAll(".prompt-card")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                messageInput.value =
                    card.dataset.prompt;

                resizeInput();

                updateSendButton();

                messageInput.focus();

            }
        );

    });


/* ============================================================
   NEW CHAT
============================================================ */

newChatButton.addEventListener(
    "click",
    () => {

        conversationStarted =
            false;

        messages.innerHTML =
            "";

        messages.classList.add(
            "hidden"
        );

        welcomeScreen.classList.remove(
            "hidden"
        );

        messageInput.value =
            "";

        messageInput.style.height =
            "auto";

        updateSendButton();

        closeMobileSidebar();

    }
);


/* ============================================================
   DESKTOP SIDEBAR
============================================================ */

desktopSidebarToggle.addEventListener(
    "click",
    () => {

        sidebar.classList.add(
            "collapsed"
        );

        openSidebarButton.style.display =
            "flex";

    }
);


openSidebarButton.addEventListener(
    "click",
    () => {

        sidebar.classList.remove(
            "collapsed"
        );

        openSidebarButton.style.display =
            "none";

    }
);


/* ============================================================
   MOBILE SIDEBAR
============================================================ */

function openMobileSidebar() {

    sidebar.classList.add(
        "open"
    );

    sidebarOverlay.classList.add(
        "open"
    );

}


function closeMobileSidebar() {

    sidebar.classList.remove(
        "open"
    );

    sidebarOverlay.classList.remove(
        "open"
    );

}


mobileMenuButton.addEventListener(
    "click",
    openMobileSidebar
);


sidebarOverlay.addEventListener(
    "click",
    closeMobileSidebar
);


/* ============================================================
   SIDEBAR SEARCH
============================================================ */

document
    .getElementById("sidebar-search-button")
    .addEventListener(
        "click",
        () => {

            messageInput.focus();

        }
    );


/* ============================================================
   ORE HOME
============================================================ */

document
    .getElementById("ore-home-button")
    .addEventListener(
        "click",
        () => {

            newChatButton.click();

        }
    );


/* ============================================================
   INITIAL
============================================================ */

updateSendButton();

</script>

</body>
</html>
