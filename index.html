<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore</title>

<link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 L61 32 L32 61 L3 32 Z' fill='none' stroke='%2300ff66' stroke-width='5'/%3E%3Cpath d='M32 15 L49 32 L32 49 L15 32 Z' fill='%2300ff66'/%3E%3C/svg%3E"
>

<script src="https://cdn.tailwindcss.com"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #000000;
    color: #ececec;
    font-family: Söhne, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
}

body {
    overflow: hidden;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 5px;
    height: 5px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: #2a2a2a;
    border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
    background: #3e3e3e;
}

/* App Layout */
#app {
    width: 100%;
    height: 100%;
    display: flex;
    overflow: hidden;
    background: #000000;
}

/* Sidebar */
#sidebar {
    width: 260px;
    height: 100%;
    flex-shrink: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    transition: transform 0.25s ease, width 0.2s ease;
}

.sidebar-inner {
    width: 260px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
}

/* Sidebar Top Header */
.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px 12px;
}

.brand-title {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9b9b9b;
    transition: background 0.15s ease, color 0.15s ease;
}

.icon-btn:hover {
    background: #171717;
    color: #ffffff;
}

/* Sidebar Menu */
.nav-section {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.nav-item {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #ececec;
    font-size: 14px;
    font-weight: 400;
    transition: background 0.15s ease;
    cursor: pointer;
}

.nav-item:hover {
    background: #171717;
}

.badge-updated {
    background: #262626;
    color: #b4b4b4;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.02em;
}

.section-divider {
    padding: 16px 10px 6px;
    font-size: 12px;
    font-weight: 600;
    color: #666666;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Sidebar Bottom User Profile */
.sidebar-bottom {
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.claim-offer-btn {
    width: 100%;
    height: 36px;
    border-radius: 18px;
    background: #171717;
    color: #ececec;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: background 0.15s ease;
}

.claim-offer-btn:hover {
    background: #222222;
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
}

.user-profile:hover {
    background: #171717;
}

.user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ab47bc;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
}

.user-info {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
}

.user-name {
    font-size: 13px;
    font-weight: 500;
    color: #ffffff;
}

.user-plan {
    font-size: 11px;
    color: #8e8e8e;
}

/* Main Workspace */
#main {
    flex: 1;
    height: 100%;
    background: #000000;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* Top Nav Pill Bar */
.top-nav-bar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 16px;
}

.mode-pill {
    background: #171717;
    border-radius: 20px;
    padding: 3px;
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.pill-btn {
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: #8e8e8e;
    transition: all 0.15s ease;
}

.pill-btn.active {
    background: #262626;
    color: #ffffff;
}

.top-right-offer {
    position: absolute;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.free-offer-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ececec;
    font-size: 13px;
    font-weight: 500;
}

/* Hero Center Screen */
.center-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 80px;
}

.hero-title {
    font-size: 30px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 28px;
    letter-spacing: -0.01em;
}

/* Input Container Box */
.input-box-wrapper {
    width: 100%;
    background: #171717;
    border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    margin-bottom: 24px;
}

.chat-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 16px;
    resize: none;
    min-height: 32px;
    max-height: 200px;
}

.chat-input::placeholder {
    color: #8e8e8e;
}

.input-actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
}

.actions-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.actions-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.round-action-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #222222;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ececec;
    transition: background 0.15s ease;
}

.round-action-btn:hover {
    background: #2c2c2c;
}

.tag-btn {
    height: 32px;
    padding: 0 10px;
    border-radius: 16px;
    background: #222222;
    color: #ececec;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.think-btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 16px;
    background: #222222;
    color: #ececec;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.voice-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #2997ff;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Prompt List */
.quick-prompts-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-left: 8px;
}

.prompt-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #b4b4b4;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: color 0.15s ease;
}

.prompt-list-item:hover {
    color: #ffffff;
}

.lang-toggle-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
}

.lang-btn {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    color: #8e8e8e;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s ease;
}

.lang-btn.active {
    background: #00ff66;
    color: #000000;
    font-weight: 600;
    border-color: #00ff66;
}
</style>
</head>

<body>

<div id="app">

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="sidebar-inner">
            
            <div class="sidebar-header">
                <div class="brand-title">
                    <svg viewBox="0 0 64 64" class="w-6 h-6">
                        <path d="M32 3 L61 32 L32 61 L3 32 Z" fill="none" stroke="#00ff66" stroke-width="5"/>
                        <path d="M32 15 L49 32 L32 49 L15 32 Z" fill="#00ff66"/>
                    </svg>
                    Ore
                </div>
                <div class="flex items-center gap-1">
                    <button class="icon-btn" title="Search chats">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </button>
                    <button class="icon-btn" title="Collapse sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
                    </button>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    New chat
                </div>
                
                <div class="nav-item justify-between">
                    <div class="flex items-center gap-3">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        Images
                    </div>
                    <span class="badge-updated">UPDATED</span>
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14M12 6v14M8 6l-4 14M12 2v4"/></svg>
                    Library
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Scheduled
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l5.58-5.58c.94-.94.94-2.48 0-3.42L12 2Z"/><circle cx="7" cy="7" r="1.5"/></svg>
                    Plugins
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.9 2.5H4a2 2 0 0 0-2 2v13.5a2 2 0 0 0 2 2h16z"/></svg>
                    Projects
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    Codex
                </div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                    More
                </div>

                <div class="section-divider">Pinned</div>

                <div class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Assignment Help
                </div>

                <div class="section-divider">
                    <span>Recents</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </div>
            </div>

            <div class="sidebar-bottom">
                <button class="claim-offer-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 5v3M7 8s0-3 2.5-3c2 0 2.5 3 2.5 3M17 8s0-3-2.5-3c-2 0-2.5 3-2.5 3"/></svg>
                    Claim offer
                </button>

                <div class="user-profile">
                    <div class="user-avatar">M</div>
                    <div class="user-info">
                        <span class="user-name">Murphy</span>
                        <span class="user-plan">Free</span>
                    </div>
                </div>
            </div>

        </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main id="main">
        
        <!-- Top Nav Bar -->
        <div class="top-nav-bar">
            <div class="mode-pill">
                <button class="pill-btn active">Chat</button>
                <button class="pill-btn flex items-center gap-1">
                    <span style="color:#00ff66;">✦</span> Work
                </button>
            </div>

            <div class="top-right-offer">
                <button class="free-offer-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 5v3"/></svg>
                    Free offer
                </button>
                <button class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
            </div>
        </div>

        <!-- Center Main Container -->
        <div class="center-container">
            <h1 class="hero-title">How can I help, Murphy?</h1>

            <!-- Input Box -->
            <div class="input-box-wrapper">
                <textarea class="chat-input" placeholder="Ask anything" rows="1"></textarea>
                
                <div class="input-actions-row">
                    <div class="actions-left">
                        <button class="round-action-btn" title="Add attachment">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                        
                        <div class="tag-btn">
                            <span class="w-4 h-4 rounded-full bg-gray-600 flex items-center justify-center text-[9px]">iq</span>
                            vidIQ
                        </div>
                    </div>

                    <div class="actions-right">
                        <button class="think-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
                            Think
                        </button>
                        
                        <button class="round-action-btn" title="Voice input">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </button>

                        <button class="voice-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10v4M6 6v12M10 3v18M14 8v8M18 5v14M22 10v4"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Action Prompt List -->
            <div class="quick-prompts-list">
                <div class="prompt-list-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                    Write or edit
                </div>
                <div class="prompt-list-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    Search the web
                </div>
            </div>

            <!-- Language Switcher Bar -->
            <div class="lang-toggle-bar">
                <button class="lang-btn active">Pidgin</button>
                <button class="lang-btn">English</button>
            </div>

        </div>

    </main>

</div>

</body>
</html>
