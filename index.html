<script>

    // ====================================================
    // BACKEND
    // ====================================================

    /*
     * When testing locally in Colab/your computer,
     * replace this with your public backend URL.
     *
     * Example:
     * https://your-backend-url.com
     */

    const API_URL = "";


    // ====================================================
    // STATE
    // ====================================================

    let currentLanguage = "pidgin";
    let isGenerating = false;


    // ====================================================
    // LANGUAGE
    // ====================================================

    function setLanguage(language) {

        currentLanguage = language;

        const pidginButton =
            document.getElementById("pidginButton");

        const englishButton =
            document.getElementById("englishButton");


        if (language === "pidgin") {

            pidginButton.className =
                "rounded-md bg-[#1a1a1a] px-3 py-1.5 text-xs font-medium text-white";

            englishButton.className =
                "rounded-md px-3 py-1.5 text-xs font-medium text-gray-500 transition hover:text-gray-300";

        } else {

            englishButton.className =
                "rounded-md bg-[#1a1a1a] px-3 py-1.5 text-xs font-medium text-white";

            pidginButton.className =
                "rounded-md px-3 py-1.5 text-xs font-medium text-gray-500 transition hover:text-gray-300";
        }
    }


    // ====================================================
    // SEND MESSAGE
    // ====================================================

    async function sendMessage() {

        if (isGenerating) {
            return;
        }


        const input =
            document.getElementById("messageInput");

        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        isGenerating = true;

        document
            .getElementById("sendButton")
            .disabled = true;


        // Hide welcome screen

        document
            .getElementById("welcomeScreen")
            .classList.add("hidden");


        // Show message container

        const messages =
            document.getElementById("messages");

        messages.classList.remove("hidden");


        // Add user message

        addMessage(
            "user",
            message
        );


        // Clear input

        input.value = "";

        autoResize(input);


        // Add typing indicator

        const typingId =
            addTypingIndicator();


        try {

            const response =
                await fetch(
                    `${API_URL}/api/chat`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: message,
                            language: currentLanguage
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `Server returned ${response.status}`
                );

            }


            const data =
                await response.json();


            removeTypingIndicator(
                typingId
            );


            addMessage(
                "ore",
                data.response || "Ore returned an empty response."
            );


        } catch (error) {

            console.error(error);

            removeTypingIndicator(
                typingId
            );


            addMessage(
                "ore",
                "I couldn't connect to the Ore backend. Make sure the FastAPI server is running and API_URL is configured correctly."
            );

        }


        isGenerating = false;

        document
            .getElementById("sendButton")
            .disabled = false;


        input.focus();
    }


    // ====================================================
    // ADD MESSAGE
    // ====================================================

    function addMessage(
        sender,
        text
    ) {

        const messages =
            document.getElementById("messages");


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "fade-in mb-8";


        if (sender === "user") {

            wrapper.innerHTML = `
                <div class="flex justify-end">
                    <div class="max-w-[85%] rounded-2xl bg-[#1a1a1a] px-4 py-3 text-sm leading-6 text-gray-100">
                        <div class="message-content"></div>
                    </div>
                </div>
            `;

        } else {

            wrapper.innerHTML = `
                <div class="flex gap-3">

                    <div class="flex h-8 w-8 shrink-0 items-center justify-center">
                        <svg
                            viewBox="0 0 40 40"
                            class="h-7 w-7"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M20 3L35 20L20 37L5 20L20 3Z"
                                stroke="#22c55e"
                                stroke-width="2.5"
                            />

                            <path
                                d="M20 9L29.5 20L20 31L10.5 20L20 9Z"
                                fill="#22c55e"
                            />
                        </svg>
                    </div>

                    <div class="min-w-0 flex-1">
                        <div class="mb-1 text-sm font-semibold">
                            Ore
                        </div>

                        <div class="message-content text-sm leading-7 text-gray-300"></div>
                    </div>

                </div>
            `;
        }


        const content =
            wrapper.querySelector(".message-content");

        content.textContent = text;


        messages.appendChild(wrapper);


        scrollToBottom();
    }


    // ====================================================
    // TYPING INDICATOR
    // ====================================================

    function addTypingIndicator() {

        const messages =
            document.getElementById("messages");

        const id =
            "typing-" + Date.now();


        const wrapper =
            document.createElement("div");

        wrapper.id = id;

        wrapper.className =
            "mb-8 fade-in";


        wrapper.innerHTML = `
            <div class="flex gap-3">

                <div class="flex h-8 w-8 shrink-0 items-center justify-center">

                    <svg
                        viewBox="0 0 40 40"
                        class="h-7 w-7"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M20 3L35 20L20 37L5 20L20 3Z"
                            stroke="#22c55e"
                            stroke-width="2.5"
                        />

                        <path
                            d="M20 9L29.5 20L20 31L10.5 20L20 9Z"
                            fill="#22c55e"
                        />
                    </svg>

                </div>

                <div class="flex items-center gap-1 pt-2">

                    <span class="typing-dot h-1.5 w-1.5 rounded-full bg-gray-400"></span>
                    <span class="typing-dot h-1.5 w-1.5 rounded-full bg-gray-400"></span>
                    <span class="typing-dot h-1.5 w-1.5 rounded-full bg-gray-400"></span>

                </div>

            </div>
        `;


        messages.appendChild(wrapper);

        scrollToBottom();


        return id;
    }


    function removeTypingIndicator(id) {

        const element =
            document.getElementById(id);

        if (element) {
            element.remove();
        }
    }


    // ====================================================
    // PROMPT BUTTONS
    // ====================================================

    function usePrompt(text) {

        const input =
            document.getElementById("messageInput");

        input.value = text;

        autoResize(input);

        input.focus();

    }


    // ====================================================
    // NEW CHAT
    // ====================================================

    function newChat() {

        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";

        messages.classList.add("hidden");


        document
            .getElementById("welcomeScreen")
            .classList.remove("hidden");


        document
            .getElementById("messageInput")
            .focus();

    }


    // ====================================================
    // ENTER KEY
    // ====================================================

    function handleKeyDown(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }


    // ====================================================
    // TEXTAREA RESIZE
    // ====================================================

    function autoResize(textarea) {

        textarea.style.height = "auto";

        textarea.style.height =
            Math.min(
                textarea.scrollHeight,
                192
            ) + "px";
    }


    // ====================================================
    // SCROLL
    // ====================================================

    function scrollToBottom() {

        const chatArea =
            document.getElementById("chatArea");

        setTimeout(() => {

            chatArea.scrollTo({
                top: chatArea.scrollHeight,
                behavior: "smooth"
            });

        }, 50);
    }


    // ====================================================
    // SIDEBAR
    // ====================================================

    function toggleSidebar() {

        const sidebar =
            document.getElementById("sidebar");

        sidebar.classList.toggle(
            "-translate-x-full"
        );
    }


    // ====================================================
    // INITIALIZATION
    // ====================================================

    document
        .getElementById("messageInput")
        .focus();

</script>
