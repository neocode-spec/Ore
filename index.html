<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ore</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ore: {
                            green: "#10B981",
                            dark: "#000000",
                            sidebar: "#050505",
                            surface: "#171717",
                            border: "#262626",
                            muted: "#8E8E8E"
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #ECECEC;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        ::selection {
            background: rgba(16, 185, 129, 0.25);
        }

        .scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 999px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        .sidebar-transition {
            transition:
                width 0.2s ease,
                transform 0.2s ease;
        }

        .message-fade {
            animation: messageFade 0.2s ease;
        }

        @keyframes messageFade {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<!-- ========================================================= -->
<!-- AUTHENTICATION SCREEN -->
<!-- ========================================================= -->

<div
    id="auth-screen"
    class="fixed inset-0 z-50 flex min-h-screen items-center justify-center bg-black px-4"
>

    <div class="w-full max-w-sm">

        <!-- Ore Logo -->
        <div class="mb-8 flex justify-center">

            <div
                class="flex h-16 w-16 items-center justify-center rounded-2xl
                       border border-emerald-500/30
                       bg-emerald-500/10
                       shadow-[0_0_40px_rgba(16,185,129,0.08)]"
            >

                <!-- Diamond -->
                <svg
                    viewBox="0 0 24 24"
                    class="h-8 w-8 fill-none stroke-emerald-400"
                    stroke-width="1.7"
                >
                    <path d="M12 2L3 8.5L12 22L21 8.5L12 2Z"/>
                    <path d="M3 8.5H21"/>
                    <path d="M8 8.5L12 22L16 8.5"/>
                </svg>

            </div>

        </div>

        <!-- Heading -->
        <div class="mb-8 text-center">

            <h1 class="text-3xl font-semibold tracking-tight text-white">
                Welcome to Ore
            </h1>

            <p class="mt-2 text-sm text-neutral-500">
                Your Nigerian AI assistant
            </p>

        </div>

        <!-- Auth Card -->
        <div
            class="rounded-2xl border border-neutral-800
                   bg-[#0D0D0D] p-6"
        >

            <!-- Tabs -->
            <div
                class="mb-6 flex rounded-xl border border-neutral-800
                       bg-black p-1"
            >

                <button
                    id="login-tab"
                    onclick="showLogin()"
                    class="flex-1 rounded-lg bg-neutral-800
                           px-4 py-2 text-sm font-medium text-white"
                >
                    Sign in
                </button>

                <button
                    id="signup-tab"
                    onclick="showSignup()"
                    class="flex-1 rounded-lg px-4 py-2
                           text-sm font-medium text-neutral-500
                           transition hover:text-white"
                >
                    Create account
                </button>

            </div>

            <!-- Login -->
            <form id="login-form" class="space-y-4">

                <div>

                    <label class="mb-2 block text-xs text-neutral-400">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                        class="w-full rounded-xl border border-neutral-800
                               bg-black px-4 py-3 text-sm text-white
                               outline-none transition
                               placeholder:text-neutral-700
                               focus:border-emerald-500/60"
                    >

                </div>

                <div>

                    <label class="mb-2 block text-xs text-neutral-400">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        class="w-full rounded-xl border border-neutral-800
                               bg-black px-4 py-3 text-sm text-white
                               outline-none transition
                               placeholder:text-neutral-700
                               focus:border-emerald-500/60"
                    >

                </div>

                <button
                    type="button"
                    onclick="openOre()"
                    class="w-full rounded-xl bg-emerald-500
                           py-3 text-sm font-semibold text-black
                           transition hover:bg-emerald-400"
                >
                    Sign in
                </button>

            </form>

            <!-- Signup -->
            <form id="signup-form" class="hidden space-y-4">

                <div>

                    <label class="mb-2 block text-xs text-neutral-400">
                        Name
                    </label>

                    <input
                        type="text"
                        placeholder="Your name"
                        class="w-full rounded-xl border border-neutral-800
                               bg-black px-4 py-3 text-sm text-white
                               outline-none transition
                               placeholder:text-neutral-700
                               focus:border-emerald-500/60"
                    >

                </div>

                <div>

                    <label class="mb-2 block text-xs text-neutral-400">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                        class="w-full rounded-xl border border-neutral-800
                               bg-black px-4 py-3 text-sm text-white
                               outline-none transition
                               placeholder:text-neutral-700
                               focus:border-emerald-500/60"
                    >

                </div>

                <div>

                    <label class="mb-2 block text-xs text-neutral-400">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Create a password"
                        class="w-full rounded-xl border border-neutral-800
                               bg-black px-4 py-3 text-sm text-white
                               outline-none transition
                               placeholder:text-neutral-700
                               focus:border-emerald-500/60"
                    >

                </div>

                <button
                    type="button"
                    onclick="openOre()"
                    class="w-full rounded-xl bg-emerald-500
                           py-3 text-sm font-semibold text-black
                           transition hover:bg-emerald-400"
                >
                    Create account
                </button>

            </form>

            <!-- Divider -->
            <div class="my-6 flex items-center gap-3">

                <div class="h-px flex-1 bg-neutral-800"></div>

                <span class="text-[11px] uppercase tracking-wider text-neutral-600">
                    or
                </span>

                <div class="h-px flex-1 bg-neutral-800"></div>

            </div>

            <!-- Guest -->
            <button
                onclick="openOre()"
                class="w-full rounded-xl border border-neutral-800
                       bg-transparent py-3 text-sm font-medium
                       text-neutral-300 transition
                       hover:bg-neutral-900 hover:text-white"
            >
                Continue as guest
            </button>

        </div>

        <p class="mt-5 text-center text-xs text-neutral-600">
            Ore · Nigerian AI
        </p>

    </div>

</div>


<!-- ========================================================= -->
<!-- MAIN ORE APPLICATION -->
<!-- ========================================================= -->

<div
    id="ore-app"
    class="hidden h-screen w-full bg-black"
>

    <!-- ===================================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================================== -->

    <aside
        id="sidebar"
        class="sidebar-transition flex h-full w-[260px]
               shrink-0 flex-col border-r border-neutral-900
               bg-[#050505]"
    >

        <!-- Sidebar Top -->
        <div class="p-3">

            <!-- Ore Brand -->
            <div class="mb-4 flex items-center justify-between px-2 py-2">

                <div class="flex items-center gap-3">

                    <div
                        class="flex h-8 w-8 items-center justify-center
                               rounded-lg border border-emerald-500/30
                               bg-emerald-500/10"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            class="h-5 w-5 fill-none stroke-emerald-400"
                            stroke-width="1.8"
                        >
                            <path d="M12 2L3 8.5L12 22L21 8.5L12 2Z"/>
                            <path d="M3 8.5H21"/>
                            <path d="M8 8.5L12 22L16 8.5"/>
                        </svg>

                    </div>

                    <span class="text-lg font-semibold text-white">
                        Ore
                    </span>

                </div>

                <button
                    onclick="toggleSidebar()"
                    class="rounded-lg p-2 text-neutral-600
                           transition hover:bg-neutral-900
                           hover:text-white"
                >
                    <svg
                        class="h-4 w-4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        viewBox="0 0 24 24"
                    >
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

            </div>

            <!-- New Chat -->
            <button
                onclick="newChat()"
                class="flex w-full items-center gap-3 rounded-xl
                       border border-neutral-800 bg-neutral-900
                       px-4 py-3 text-sm font-medium text-white
                       transition hover:bg-neutral-800"
            >

                <svg
                    class="h-4 w-4 text-neutral-400"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    viewBox="0 0 24 24"
                >
                    <path d="M12 5v14M5 12h14"/>
                </svg>

                New chat

            </button>

        </div>


        <!-- Recent Chats -->
        <div class="scrollbar flex-1 overflow-y-auto px-3">

            <p
                class="px-2 py-3 text-[11px] font-medium
                       uppercase tracking-wider text-neutral-700"
            >
                Recent
            </p>

            <div
                id="conversation-list"
                class="space-y-1"
            >

                <!-- Conversations will appear here later -->

            </div>

        </div>


        <!-- Sidebar Bottom -->
        <div class="border-t border-neutral-900 p-3">

            <button
                class="flex w-full items-center gap-3 rounded-xl
                       px-3 py-3 text-left transition
                       hover:bg-neutral-900"
            >

                <div
                    class="flex h-8 w-8 items-center justify-center
                           rounded-full bg-neutral-800
                           text-xs font-semibold text-white"
                >
                    U
                </div>

                <div class="min-w-0 flex-1">

                    <p class="truncate text-sm font-medium text-white">
                        Guest
                    </p>

                    <p class="text-xs text-neutral-600">
                        Free account
                    </p>

                </div>

                <svg
                    class="h-4 w-4 text-neutral-600"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    viewBox="0 0 24 24"
                >
                    <path d="M6 9l6 6 6-6"/>
                </svg>

            </button>

        </div>

    </aside>


    <!-- ===================================================== -->
    <!-- MAIN -->
    <!-- ===================================================== -->

    <main class="flex min-w-0 flex-1 flex-col bg-black">


        <!-- Header -->
        <header
            class="flex h-14 shrink-0 items-center
                   justify-between border-b border-neutral-900
                   px-4"
        >

            <!-- Mobile / collapsed sidebar -->
            <button
                onclick="toggleSidebar()"
                class="rounded-lg p-2 text-neutral-500
                       transition hover:bg-neutral-900
                       hover:text-white"
            >

                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    viewBox="0 0 24 24"
                >
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>

            </button>


            <!-- Header Ore -->
            <div class="flex items-center gap-2">

                <div
                    class="flex h-7 w-7 items-center justify-center
                           rounded-lg bg-emerald-500/10
                           border border-emerald-500/20"
                >

                    <svg
                        viewBox="0 0 24 24"
                        class="h-4 w-4 fill-none stroke-emerald-400"
                        stroke-width="1.8"
                    >
                        <path d="M12 2L3 8.5L12 22L21 8.5L12 2Z"/>
                        <path d="M3 8.5H21"/>
                        <path d="M8 8.5L12 22L16 8.5"/>
                    </svg>

                </div>

                <span class="text-sm font-semibold text-white">
                    Ore
                </span>

            </div>


            <!-- Header spacer -->
            <div class="w-9"></div>

        </header>


        <!-- ================================================= -->
        <!-- CHAT -->
        <!-- ================================================= -->

        <section
            id="chat-container"
            class="scrollbar flex-1 overflow-y-auto"
        >

            <div
                id="chat-messages"
                class="mx-auto flex min-h-full
                       w-full max-w-3xl flex-col
                       px-5 pb-36 pt-8"
            >

                <!-- Welcome -->
                <div
                    id="welcome-screen"
                    class="flex flex-1 flex-col
                           items-center justify-center
                           py-20 text-center"
                >

                    <!-- Large Diamond -->
                    <div
                        class="mb-7 flex h-20 w-20 items-center
                               justify-center rounded-3xl
                               border border-emerald-500/20
                               bg-emerald-500/5
                               shadow-[0_0_60px_rgba(16,185,129,0.06)]"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            class="h-10 w-10 fill-none stroke-emerald-400"
                            stroke-width="1.5"
                        >
                            <path d="M12 2L3 8.5L12 22L21 8.5L12 2Z"/>
                            <path d="M3 8.5H21"/>
                            <path d="M8 8.5L12 22L16 8.5"/>
                        </svg>

                    </div>


                    <h1
                        class="text-3xl font-semibold
                               tracking-tight text-white"
                    >
                        What can I help you with?
                    </h1>


                    <p
                        class="mt-3 max-w-md text-sm
                               leading-6 text-neutral-500"
                    >
                        Ask Ore about Nigeria, history, geography,
                        culture, technology, or anything else.
                    </p>

                </div>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- COMPOSER -->
        <!-- ================================================= -->

        <footer
            class="fixed bottom-0 left-0 right-0
                   pointer-events-none"
        >

            <div
                class="mx-auto w-full max-w-3xl
                       px-4 pb-5"
            >

                <div
                    class="pointer-events-auto rounded-2xl
                           border border-neutral-800
                           bg-[#171717]
                           shadow-[0_8px_40px_rgba(0,0,0,0.45)]"
                >

                    <!-- Textarea -->
                    <textarea
                        id="message-input"
                        rows="1"
                        placeholder="Message Ore..."
                        class="block max-h-40 min-h-[52px]
                               w-full resize-none
                               bg-transparent px-5 pt-4 pb-2
                               text-sm text-white outline-none
                               placeholder:text-neutral-600"
                    ></textarea>


                    <!-- Composer Bottom -->
                    <div
                        class="flex items-center justify-between
                               px-4 pb-3"
                    >

                        <!-- Language -->
                        <div
                            class="flex items-center rounded-full
                                   border border-neutral-800
                                   bg-black p-1"
                        >

                            <button
                                id="pidgin-button"
                                onclick="setLanguage('pidgin')"
                                class="rounded-full bg-neutral-800
                                       px-3 py-1.5 text-xs
                                       font-medium text-white"
                            >
                                Pidgin
                            </button>

                            <button
                                id="english-button"
                                onclick="setLanguage('english')"
                                class="rounded-full px-3 py-1.5
                                       text-xs font-medium
                                       text-neutral-500
                                       transition hover:text-white"
                            >
                                English
                            </button>

                        </div>


                        <!-- Send -->
                        <button
                            id="send-button"
                            onclick="sendMessage()"
                            class="flex h-9 w-9 items-center
                                   justify-center rounded-full
                                   bg-white text-black
                                   transition hover:bg-neutral-300"
                        >

                            <svg
                                class="h-4 w-4"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                viewBox="0 0 24 24"
                            >
                                <path d="M12 19V5"/>
                                <path d="M6 11l6-6 6 6"/>
                            </svg>

                        </button>

                    </div>

                </div>


                <p
                    class="mt-2 text-center text-[10px]
                           text-neutral-700"
                >
                    Ore can make mistakes. Check important information.
                </p>

            </div>

        </footer>

    </main>

</div>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>

    let selectedLanguage = "pidgin";
    let sidebarOpen = true;


    // ========================================================
    // AUTH UI
    // ========================================================

    function showLogin() {

        document
            .getElementById("login-form")
            .classList
            .remove("hidden");

        document
            .getElementById("signup-form")
            .classList
            .add("hidden");


        document
            .getElementById("login-tab")
            .className =
            "flex-1 rounded-lg bg-neutral-800 px-4 py-2 text-sm font-medium text-white";


        document
            .getElementById("signup-tab")
            .className =
            "flex-1 rounded-lg px-4 py-2 text-sm font-medium text-neutral-500 transition hover:text-white";
    }


    function showSignup() {

        document
            .getElementById("signup-form")
            .classList
            .remove("hidden");

        document
            .getElementById("login-form")
            .classList
            .add("hidden");


        document
            .getElementById("signup-tab")
            .className =
            "flex-1 rounded-lg bg-neutral-800 px-4 py-2 text-sm font-medium text-white";


        document
            .getElementById("login-tab")
            .className =
            "flex-1 rounded-lg px-4 py-2 text-sm font-medium text-neutral-500 transition hover:text-white";
    }


    // TEMPORARY
    // This only opens the UI.
    // Real authentication will be connected later.

    function openOre() {

        document
            .getElementById("auth-screen")
            .classList
            .add("hidden");

        document
            .getElementById("ore-app")
            .classList
            .remove("hidden");
    }


    // ========================================================
    // SIDEBAR
    // ========================================================

    function toggleSidebar() {

        const sidebar =
            document.getElementById("sidebar");

        sidebarOpen = !sidebarOpen;

        if (sidebarOpen) {

            sidebar.classList.remove("w-0");
            sidebar.classList.add("w-[260px]");

        } else {

            sidebar.classList.remove("w-[260px]");
            sidebar.classList.add("w-0");
        }
    }


    // ========================================================
    // LANGUAGE
    // ========================================================

    function setLanguage(language) {

        selectedLanguage = language;

        const pidgin =
            document.getElementById("pidgin-button");

        const english =
            document.getElementById("english-button");


        if (language === "pidgin") {

            pidgin.className =
                "rounded-full bg-neutral-800 px-3 py-1.5 text-xs font-medium text-white";

            english.className =
                "rounded-full px-3 py-1.5 text-xs font-medium text-neutral-500 transition hover:text-white";

        } else {

            english.className =
                "rounded-full bg-neutral-800 px-3 py-1.5 text-xs font-medium text-white";

            pidgin.className =
                "rounded-full px-3 py-1.5 text-xs font-medium text-neutral-500 transition hover:text-white";
        }
    }


    // ========================================================
    // NEW CHAT
    // ========================================================

    function newChat() {

        const messages =
            document.getElementById("chat-messages");

        messages.innerHTML = `

            <div
                id="welcome-screen"
                class="flex flex-1 flex-col
                       items-center justify-center
                       py-20 text-center"
            >

                <div
                    class="mb-7 flex h-20 w-20 items-center
                           justify-center rounded-3xl
                           border border-emerald-500/20
                           bg-emerald-500/5"
                >

                    <svg
                        viewBox="0 0 24 24"
                        class="h-10 w-10 fill-none stroke-emerald-400"
                        stroke-width="1.5"
                    >
                        <path d="M12 2L3 8.5L12 22L21 8.5L12 2Z"/>
                        <path d="M3 8.5H21"/>
                        <path d="M8 8.5L12 22L16 8.5"/>
                    </svg>

                </div>

                <h1
                    class="text-3xl font-semibold
                           tracking-tight text-white"
                >
                    What can I help you with?
                </h1>

                <p
                    class="mt-3 max-w-md text-sm
                           leading-6 text-neutral-500"
                >
                    Ask Ore about Nigeria, history, geography,
                    culture, technology, or anything else.
                </p>

            </div>
        `;

        document
            .getElementById("message-input")
            .value = "";
    }


    // ========================================================
    // CHAT
    // ========================================================

    function sendMessage() {

        const input =
            document.getElementById("message-input");

        const text =
            input.value.trim();

        if (!text) return;


        const welcome =
            document.getElementById("welcome-screen");

        if (welcome) {
            welcome.remove();
        }


        const messages =
            document.getElementById("chat-messages");


        // User message
        const userMessage =
            document.createElement("div");

        userMessage.className =
            "message-fade mb-6 flex justify-end";


        const bubble =
            document.createElement("div");

        bubble.className =
            "max-w-[80%] rounded-2xl bg-neutral-800 px-4 py-3 text-sm leading-6 text-white";


        bubble.textContent = text;

        userMessage.appendChild(bubble);

        messages.appendChild(userMessage);


        input.value = "";

        input.style.height = "auto";


        // Temporary Ore response
        // Backend connection comes later.

        const oreMessage =
            document.createElement("div");

        oreMessage.className =
            "message-fade mb-6 flex gap-3";


        const logo =
            document.createElement("div");

        logo.className =
            "flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-emerald-500/20 bg-emerald-500/10";


        logo.innerHTML = `
            <svg
                viewBox="0 0 24 24"
                class="h-4 w-4 fill-none stroke-emerald-400"
                stroke-width="1.8"
            >
                <path d="M12 2L3 8.5L12 22L21 8.5L12 2Z"/>
                <path d="M3 8.5H21"/>
                <path d="M8 8.5L12 22L16 8.5"/>
            </svg>
        `;


        const response =
            document.createElement("div");

        response.className =
            "pt-1 text-sm leading-6 text-neutral-400";


        response.textContent =
            "Ore is getting ready. The model connection will be added next.";


        oreMessage.appendChild(logo);
        oreMessage.appendChild(response);

        messages.appendChild(oreMessage);


        document
            .getElementById("chat-container")
            .scrollTop =
            document.getElementById("chat-container").scrollHeight;
    }


    // ========================================================
    // TEXTAREA AUTO HEIGHT
    // ========================================================

    const messageInput =
        document.getElementById("message-input");


    messageInput.addEventListener(
        "input",
        function () {

            this.style.height = "auto";

            this.style.height =
                Math.min(this.scrollHeight, 160) + "px";
        }
    );


    messageInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );

</script>

</body>
</html>
