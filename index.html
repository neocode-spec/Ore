<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ore AI - Nigerian AI Assistant</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310B981'><path d='M12 2L2 9l10 13 10-13-10-7zm0 3.2L18.6 9 12 18.5 5.4 9 12 5.2z'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #000000; font-family: system-ui, -apple-system, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #212121; border-radius: 3px; }
    .sidebar-transition { transition: transform 0.25s ease-in-out, width 0.25s ease-in-out; }
    
    /* Blur effect for unauthenticated state */
    .blurred-content {
      filter: blur(8px);
      pointer-events: none;
      opacity: 0.5;
    }
  </style>
</head>
<body class="text-[#ECECEC] h-screen flex overflow-hidden bg-black">

  <!-- AUTH OVERLAY (Shows until logged in) -->
  <div id="auth-overlay" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-[#171717] border border-[#2A2A2A] rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <!-- Logo -->
      <div class="flex items-center justify-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center">
          <i class="fa-solid fa-gem text-emerald-400 text-xl"></i>
        </div>
      </div>

      <!-- Title -->
      <h1 class="text-3xl font-bold text-white text-center mb-2">Ore</h1>
      <p class="text-sm text-[#8E8E8E] text-center mb-8">Your Personal Nigerian AI Assistant</p>

      <!-- Tab Switcher -->
      <div class="flex bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg mb-6 p-1">
        <button id="login-tab" onclick="switchTab('login')" class="flex-1 py-2 px-4 rounded font-medium text-sm transition bg-[#212121] text-white">
          Sign In
        </button>
        <button id="signup-tab" onclick="switchTab('signup')" class="flex-1 py-2 px-4 rounded font-medium text-sm transition text-[#8E8E8E] hover:text-white">
          Create Account
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[#B4B4B4] mb-2">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            required 
            placeholder="you@example.com" 
            class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-sm text-white placeholder-[#6E6E6E] focus:outline-none focus:border-emerald-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#B4B4B4] mb-2">Password</label>
          <input 
            type="password" 
            id="login-password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-sm text-white placeholder-[#6E6E6E] focus:outline-none focus:border-emerald-500 transition"
          />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg text-sm transition">
          Sign In
        </button>
      </form>

      <!-- SIGNUP FORM (Hidden by default) -->
      <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-medium text-[#B4B4B4] mb-2">Email Address</label>
          <input 
            type="email" 
            id="signup-email" 
            required 
            placeholder="you@example.com" 
            class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-sm text-white placeholder-[#6E6E6E] focus:outline-none focus:border-emerald-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#B4B4B4] mb-2">Create Password</label>
          <input 
            type="password" 
            id="signup-password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-sm text-white placeholder-[#6E6E6E] focus:outline-none focus:border-emerald-500 transition"
          />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg text-sm transition">
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-[#2A2A2A]"></div>
        <span class="text-xs text-[#6E6E6E] uppercase font-medium">OR</span>
        <div class="flex-1 h-px bg-[#2A2A2A]"></div>
      </div>

      <!-- Guest Mode -->
      <button type="button" onclick="loginAsGuest()" class="w-full bg-[#0D0D0D] hover:bg-[#1A1A1A] text-white border border-[#2A2A2A] font-medium py-3 rounded-lg text-sm transition">
        Continue as Guest
      </button>

      <!-- Error Message -->
      <div id="auth-error" class="mt-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-xs hidden"></div>
    </div>
  </div>

  <!-- MAIN APP (Blurred until auth) -->
  <div id="app-content" class="w-full h-full flex blurred-content transition-all duration-300">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-[#000000] border-r border-[#1E1E1E] flex flex-col justify-between p-3 sidebar-transition shrink-0">
      <div class="space-y-4">
        <div class="flex justify-between items-center px-2 py-1">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-sm text-white">
              <i class="fa-solid fa-gem text-xs"></i>
            </div>
            <span class="font-bold text-xl text-white tracking-wide">Ore</span>
          </div>
          <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white transition p-1">
            <i class="fa-regular fa-window-restore text-sm"></i>
          </button>
        </div>

        <button onclick="resetChat()" class="w-full bg-[#171717] hover:bg-[#212121] text-white text-sm font-medium py-2 px-3 rounded-xl border border-[#2A2A2A] flex items-center gap-3 transition">
          <i class="fa-regular fa-pen-to-square"></i> New chat
        </button>
      </div>

      <!-- User Profile Footer -->
      <div class="pt-3 border-t border-[#1E1E1E]">
        <div class="flex items-center gap-2 px-2 mb-3">
          <div id="user-avatar" class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs text-white">U</div>
          <div class="flex-1">
            <p id="user-name" class="font-medium text-sm text-white">User</p>
            <p class="text-xs text-[#8E8E8E]">Logged In</p>
          </div>
        </div>
        <button onclick="logout()" class="w-full text-left text-xs bg-[#171717] hover:bg-[#212121] text-[#8E8E8E] hover:text-white border border-[#2A2A2A] px-3 py-2 rounded-lg font-medium transition">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs mr-2"></i> Logout
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col justify-between items-center relative h-full bg-black">

      <!-- HEADER -->
      <header class="w-full py-3 px-4 flex justify-between items-center border-b border-[#141414]">
        <button id="sidebar-toggle-btn" onclick="toggleSidebar()" class="text-slate-400 hover:text-white transition p-2 rounded-lg bg-[#141414] border border-[#212121]">
          <i class="fa-regular fa-window-restore text-sm"></i>
        </button>
        <h2 class="font-semibold text-white">Chat with Ore</h2>
        <div class="w-9"></div>
      </header>

      <!-- CHAT CONTAINER -->
      <main id="chat-box" class="flex-1 w-full max-w-3xl overflow-y-auto custom-scroll p-6 space-y-6 flex flex-col">
        <div id="welcome-container" class="my-auto w-full flex flex-col items-center space-y-8">
          <div class="w-20 h-20 rounded-2xl bg-emerald-600/10 border border-emerald-500/20 flex items-center justify-center">
            <i class="fa-solid fa-gem text-emerald-400 text-3xl"></i>
          </div>
          <div class="text-center">
            <h1 class="text-4xl font-bold text-white mb-2">What's on the agenda today?</h1>
            <p class="text-[#8E8E8E] text-sm">Ask Ore anything about Nigeria, Rivers State, local opportunities, or just chat in Pidgin</p>
          </div>
        </div>
      </main>

      <!-- INPUT FOOTER -->
      <footer class="w-full max-w-3xl pb-6 px-6">
        <div class="bg-[#212121] border border-[#303030] rounded-2xl p-4 shadow-2xl focus-within:border-[#424242] transition">
          <textarea 
            id="user-input" 
            rows="2" 
            placeholder="Ask anything..." 
            spellcheck="false"
            class="bg-transparent border-none outline-none text-white placeholder-[#8E8E8E] resize-none w-full text-sm custom-scroll"
          ></textarea>
          
          <div class="flex justify-between items-center mt-3 pt-3 border-t border-[#303030]">
            <div class="flex items-center bg-[#171717] border border-[#303030] rounded-full p-1 text-xs">
              <button id="lang-pidgin" onclick="setLanguage('pidgin')" class="bg-[#212121] text-white px-3 py-1.5 rounded-full font-medium transition">Pidgin</button>
              <button id="lang-english" onclick="setLanguage('english')" class="text-[#8E8E8E] hover:text-white px-3 py-1.5 rounded-full font-medium transition">English</button>
            </div>

            <button id="send-btn" onclick="sendMessage()" class="bg-white hover:bg-slate-200 text-black font-bold rounded-full w-8 h-8 flex items-center justify-center transition">
              <i class="fa-solid fa-arrow-up text-xs"></i>
            </button>
          </div>
        </div>
      </footer>

    </div>

  </div>

  <script>
    // 🔗 RENDER BACKEND URL (Production)
    const BACKEND_URL = "https://ore-prime.onrender.com";

    let authToken = localStorage.getItem('ore_token');
    let isAuthenticated = !!authToken;
    let selectedLanguage = 'pidgin';
    let isSidebarOpen = true;

    // Initialize app state
    function initApp() {
      if (isAuthenticated) {
        hideAuthOverlay();
      } else {
        showAuthOverlay();
      }
    }

    // Auth UI Functions
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const loginTab = document.getElementById('login-tab');
      const signupTab = document.getElementById('signup-tab');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        loginTab.classList.add('bg-[#212121]', 'text-white');
        loginTab.classList.remove('text-[#8E8E8E]');
        signupTab.classList.remove('bg-[#212121]', 'text-white');
        signupTab.classList.add('text-[#8E8E8E]');
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        signupTab.classList.add('bg-[#212121]', 'text-white');
        signupTab.classList.remove('text-[#8E8E8E]');
        loginTab.classList.remove('bg-[#212121]', 'text-white');
        loginTab.classList.add('text-[#8E8E8E]');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch(`${BACKEND_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.user_id) {
          authToken = data.user_id;
          localStorage.setItem('ore_token', authToken);
          localStorage.setItem('ore_email', email);
          isAuthenticated = true;
          updateUserProfile(email);
          hideAuthOverlay();
          document.getElementById('login-email').value = '';
          document.getElementById('login-password').value = '';
        } else {
          showAuthError(data.detail || 'Login failed');
        }
      } catch (err) {
        showAuthError('Connection error. Make sure backend is running.');
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      try {
        const res = await fetch(`${BACKEND_URL}/api/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.user_id) {
          authToken = data.user_id;
          localStorage.setItem('ore_token', authToken);
          localStorage.setItem('ore_email', email);
          isAuthenticated = true;
          updateUserProfile(email);
          hideAuthOverlay();
          document.getElementById('signup-email').value = '';
          document.getElementById('signup-password').value = '';
        } else {
          showAuthError(data.detail || 'Signup failed');
        }
      } catch (err) {
        showAuthError('Connection error. Make sure backend is running.');
      }
    }

    function loginAsGuest() {
      authToken = 'guest_' + Date.now();
      localStorage.setItem('ore_token', authToken);
      isAuthenticated = true;
      updateUserProfile('Guest User');
      hideAuthOverlay();
    }

    function logout() {
      localStorage.removeItem('ore_token');
      localStorage.removeItem('ore_email');
      authToken = null;
      isAuthenticated = false;
      showAuthOverlay();
      resetChat();
    }

    function showAuthOverlay() {
      document.getElementById('auth-overlay').classList.remove('hidden');
      document.getElementById('app-content').classList.add('blurred-content');
    }

    function hideAuthOverlay() {
      document.getElementById('auth-overlay').classList.add('hidden');
      document.getElementById('app-content').classList.remove('blurred-content');
    }

    function showAuthError(msg) {
      const errorDiv = document.getElementById('auth-error');
      errorDiv.textContent = msg;
      errorDiv.classList.remove('hidden');
      setTimeout(() => errorDiv.classList.add('hidden'), 5000);
    }

    function updateUserProfile(email) {
      document.getElementById('user-name').textContent = email.split('@')[0];
      document.getElementById('user-avatar').textContent = email[0].toUpperCase();
    }

    // Chat Functions
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      document.getElementById('sidebar').classList.toggle('hidden');
    }

    function setLanguage(lang) {
      selectedLanguage = lang;
      document.getElementById('lang-pidgin').className = lang === 'pidgin' 
        ? 'bg-[#212121] text-white px-3 py-1.5 rounded-full font-medium transition' 
        : 'text-[#8E8E8E] hover:text-white px-3 py-1.5 rounded-full font-medium transition';
      document.getElementById('lang-english').className = lang === 'english' 
        ? 'bg-[#212121] text-white px-3 py-1.5 rounded-full font-medium transition' 
        : 'text-[#8E8E8E] hover:text-white px-3 py-1.5 rounded-full font-medium transition';
    }

    function resetChat() {
      location.reload();
    }

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const welcome = document.getElementById('welcome-container');
      if (welcome) welcome.remove();

      // Display user message
      chatBox.innerHTML += `
        <div class="w-full flex justify-end">
          <div class="bg-emerald-600/20 text-white px-4 py-2.5 rounded-2xl max-w-[70%] border border-emerald-600/30 text-sm">${text}</div>
        </div>
      `;
      userInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Display loading state
      const botMsgId = 'bot-' + Date.now();
      chatBox.innerHTML += `
        <div class="w-full flex justify-start items-start gap-3">
          <div class="w-6 h-6 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs text-white shrink-0 mt-1">O</div>
          <div id="${botMsgId}" class="text-[#8E8E8E] text-sm py-2">
            <span class="animate-pulse">Ore dey think...</span>
          </div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(`${BACKEND_URL}/api/chat`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ 
            user_id: authToken,
            message: text, 
            language: selectedLanguage 
          })
        });

        const data = await res.json();
        const botElement = document.getElementById(botMsgId);
        botElement.innerHTML = data.response || 'Error getting response';
      } catch (err) {
        document.getElementById(botMsgId).innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Start app
    initApp();
  </script>
</body>
</html>
