<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore</title>

<!-- =========================================================
     FIREBASE
========================================================= -->

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Emerald Faceted Gem Favicon -->
<link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpolygon points='8,3 16,3 14,8 10,8' fill='%23ccffdd'/%3E%3Cpolygon points='6,3 8,3 10,8 2,9' fill='%2352ff94'/%3E%3Cpolygon points='16,3 18,3 22,9 14,8' fill='%2300e65c'/%3E%3Cpolygon points='10,8 14,8 12,21' fill='%2300ff66'/%3E%3Cpolygon points='2,9 10,8 12,21' fill='%2300b347'/%3E%3Cpolygon points='22,9 14,8 12,21' fill='%23008033'/%3E%3C/svg%3E"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #000000;
    color: #ececec;
    font-family: Söhne, ui-sans-serif, system-ui, -apple-system,
        "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
}

body {
    overflow: hidden;
}

/* =========================================================
   TEXT SELECTION
========================================================= */

.chat-input,
.ore-response,
.ore-user-bubble,
.auth-message,
.auth-title,
.auth-subtitle,
.chat-history-title {
    user-select: text;
}

button,
.nav-item,
.user-profile,
.brand-title,
.chat-history-item {
    user-select: none;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 5px;
    height: 5px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #2a2a2a;
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: #3e3e3e;
}

/* =========================================================
   APP
========================================================= */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    overflow: hidden;
    background: #000000;
    position: relative;
}

/* =========================================================
   LOGIN HEADER
========================================================= */

#auth-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.auth-header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffffff;
    font-size: 17px;
    font-weight: 600;
}

.auth-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.auth-header-text {
    color: #8e8e8e;
    font-size: 13px;
}

.auth-login-btn {
    height: 34px;
    padding: 0 15px;
    border-radius: 17px;
    background: #ffffff;
    color: #000000;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
}

.auth-login-btn:hover {
    background: #e9e9e9;
    transform: translateY(-1px);
}

/* =========================================================
   AUTH MODAL
========================================================= */

#auth-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(12px);
}

#auth-modal.visible {
    display: flex;
}

.auth-card {
    width: min(420px, calc(100% - 32px));
    background: #111111;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.65);
}

.auth-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #1d1d1d;
    color: #888888;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: auto;
    border: none;
}

.auth-close:hover {
    background: #292929;
    color: #ffffff;
}

.auth-logo {
    width: 48px;
    height: 48px;
    margin: 8px auto 18px;
    display: block;
}

.auth-title {
    text-align: center;
    font-size: 25px;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 8px;
}

.auth-subtitle {
    text-align: center;
    color: #8e8e8e;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 25px;
}

.google-login-btn {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    background: #ffffff;
    color: #111111;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    border: none;
}

.google-login-btn:hover {
    background: #eeeeee;
}

.google-icon {
    width: 18px;
    height: 18px;
}

.auth-message {
    min-height: 20px;
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #777777;
}

/* =========================================================
   SIDEBAR
========================================================= */

#sidebar {
    width: 260px;
    height: 100%;
    flex-shrink: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.05);
    transition: margin-left 0.25s cubic-bezier(0.4,0,0.2,1);
    z-index: 200;
}

#sidebar.collapsed {
    margin-left: -260px;
}

.sidebar-inner {
    width: 260px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px 12px;
}

.brand-title {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9b9b9b;
    background: transparent;
    border: none;
    cursor: pointer;
}

.icon-btn:hover {
    background: #171717;
    color: #ffffff;
}

.nav-section {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.nav-item {
    width: 100%;
    min-height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #ececec;
    font-size: 14px;
    cursor: pointer;
}

.nav-item:hover {
    background: #171717;
}

.badge-updated {
    background: #262626;
    color: #b4b4b4;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
}

.section-divider {
    padding: 16px 10px 6px;
    font-size: 12px;
    font-weight: 600;
    color: #666666;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* =========================================================
   CHAT HISTORY
========================================================= */

#chat-history {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 2px;
}

.chat-history-item {
    position: relative;
    width: 100%;
    min-height: 38px;
    padding: 8px 34px 8px 10px;
    border-radius: 8px;
    color: #bdbdbd;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: background 0.15s ease, color 0.15s ease;
}

.chat-history-item:hover {
    background: #171717;
    color: #ffffff;
}

.chat-history-item.active {
    background: #1b1b1b;
    color: #ffffff;
}

.chat-history-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
}

.chat-history-menu-btn {
    position: absolute;
    right: 5px;
    top: 5px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: transparent;
    color: #777777;
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-history-menu-btn:hover {
    background: #292929;
    color: #ffffff;
}

.chat-history-dropdown {
    position: fixed;
    z-index: 999;
    width: 150px;
    background: #181818;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    display: none;
}

.chat-history-dropdown.visible {
    display: block;
}

.history-menu-item {
    width: 100%;
    height: 34px;
    border: none;
    background: transparent;
    color: #eeeeee;
    text-align: left;
    padding: 0 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
}

.history-menu-item:hover {
    background: #282828;
}

.history-menu-item.delete {
    color: #ff6b6b;
}

/* =========================================================
   SIDEBAR BOTTOM
========================================================= */

.sidebar-bottom {
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
}

.claim-offer-btn {
    width: 100%;
    height: 36px;
    border-radius: 18px;
    background: #171717;
    color: #ececec;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
}

.claim-offer-btn:hover {
    background: #222222;
}

.user-profile {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
}

.user-profile:hover {
    background: #171717;
}

.user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ab47bc;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.user-info {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    min-width: 0;
}

.user-name {
    font-size: 13px;
    font-weight: 500;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.user-plan {
    font-size: 11px;
    color: #8e8e8e;
}

#user-menu {
    position: absolute;
    left: 8px;
    bottom: 62px;
    width: 220px;
    background: #181818;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 6px;
    display: none;
    z-index: 300;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

#user-menu.visible {
    display: block;
}

.user-menu-email {
    padding: 9px 10px;
    color: #777777;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.logout-btn {
    width: 100%;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #eeeeee;
    text-align: left;
    padding: 0 10px;
    cursor: pointer;
    font-size: 13px;
}

.logout-btn:hover {
    background: #272727;
}

/* =========================================================
   MAIN
========================================================= */

#main {
    flex: 1;
    height: 100%;
    background: #000000;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

#open-sidebar-btn {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 250;
    display: none;
    background: #171717;
    border: 1px solid rgba(255,255,255,0.1);
}

/* =========================================================
   TOP NAV
========================================================= */

.top-nav-bar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 16px;
    flex-shrink: 0;
}

.mode-pill {
    background: #171717;
    border-radius: 20px;
    padding: 3px;
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid rgba(255,255,255,0.05);
}

.pill-btn {
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: #8e8e8e;
    background: transparent;
    border: none;
    cursor: pointer;
}

.pill-btn.active {
    background: #262626;
    color: #ffffff;
}

.top-right-offer {
    position: absolute;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.free-offer-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ececec;
    background: transparent;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}

/* =========================================================
   CENTER
========================================================= */

.center-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 40px;
}

.hero-title {
    font-size: 30px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 28px;
    letter-spacing: -0.01em;
    text-align: center;
}

/* =========================================================
   CHAT BAR
========================================================= */

.pixel-chat-bar {
    width: 100%;
    background: #1c1c1e;
    border-radius: 32px;
    padding: 12px 18px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.pixel-chat-bar:focus-within {
    border-color: rgba(255,255,255,0.22);
}

.chat-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 16px;
    resize: none;
    min-height: 28px;
    max-height: 180px;
}

.chat-input::placeholder {
    color: #8e8e8e;
}

.pixel-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 4px;
}

.toolbar-left,
.toolbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.pixel-icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2c2c2e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e3e3e3;
    border: none;
    cursor: pointer;
}

.pixel-icon-btn:hover {
    background: #3a3a3c;
    transform: scale(1.04);
}

.pixel-pill-btn {
    height: 36px;
    padding: 0 14px;
    border-radius: 18px;
    background: #2c2c2e;
    color: #e3e3e3;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    border: 1px solid transparent;
}

.pixel-pill-btn:hover {
    background: #3a3a3c;
}

.pixel-pill-btn.active {
    background: #3a3a3c;
    border-color: #00ff66;
    color: #ffffff;
}

.search-star {
    color: #00ff66;
    font-size: 13px;
    line-height: 1;
    margin-left: -2px;
}

.voice-sphere-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2997ff;
    color: #ffffff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* =========================================================
   LANGUAGE
========================================================= */

.lang-toggle-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 24px;
}

.lang-btn {
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 14px;
    color: #8e8e8e;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
}

.lang-btn:hover {
    color: #ffffff;
}

.lang-btn.active {
    background: #00ff66;
    color: #000000;
    font-weight: 600;
    border-color: #00ff66;
}

/* =========================================================
   CHAT ACTIVE
========================================================= */

body.chat-active .hero-title,
body.chat-active .lang-toggle-bar {
    display: none;
}

body.chat-active .center-container {
    flex: none;
    padding-bottom: 20px;
    justify-content: flex-end;
}

/* =========================================================
   CONVERSATION
========================================================= */

#ore-conversation {
    width: 100%;
    max-width: 768px;
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 24px;
    margin: 0 auto;
}

.ore-message {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.ore-message-user {
    align-items: flex-end;
}

.ore-message-ore {
    align-items: flex-start;
}

.ore-message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
}

.ore-message-label {
    font-size: 13px;
    font-weight: 600;
    color: #00ff66;
}

.ore-message-label-user {
    font-size: 12px;
    color: #777777;
    padding: 0 4px;
}

.ore-user-bubble {
    max-width: 80%;
    background: #1c1c1e;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 11px 15px;
    color: #ffffff;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.ore-response {
    width: 100%;
    color: #ececec;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding: 0 4px;
}

/* =========================================================
   KEEPING YOUR DIAMOND
========================================================= */

.ore-diamond-gem {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 6px rgba(0,255,102,0.7));
    animation: oreGemPulse 1.2s ease-in-out infinite;
}

.ore-diamond-gem svg {
    width: 100%;
    height: 100%;
}

/* =========================================================
   NEW THINKING DOTS
========================================================= */

.ore-thinking-area {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 2px 4px;
}

.ore-thinking-text {
    color: #8e8e8e;
    font-size: 14px;
}

.ore-thinking-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 20px;
}

.ore-thinking-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #00ff66;
    box-shadow: 0 0 7px rgba(0,255,102,0.55);
    animation: oreDotPulse 1.2s ease-in-out infinite;
}

.ore-thinking-dot:nth-child(2) {
    animation-delay: 0.18s;
}

.ore-thinking-dot:nth-child(3) {
    animation-delay: 0.36s;
}

/* =========================================================
   GREEN RESPONSE GLOW
========================================================= */

.ore-message-ore.generating {
    animation: oreResponseGlow 1.8s ease-in-out infinite;
}

@keyframes oreResponseGlow {
    0%, 100% {
        filter: drop-shadow(0 0 0 rgba(0,255,102,0));
    }

    50% {
        filter: drop-shadow(0 0 10px rgba(0,255,102,0.16));
    }
}

@keyframes oreDotPulse {
    0%, 100% {
        transform: scale(0.65);
        opacity: 0.35;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

@keyframes oreGemPulse {
    0%, 100% {
        transform: scale(0.92);
        filter: drop-shadow(0 0 4px rgba(0,255,102,0.5));
        opacity: 0.7;
    }

    50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 10px rgba(0,255,102,0.9));
        opacity: 1;
    }
}

.ore-cursor {
    display: inline-block;
    width: 2px;
    height: 17px;
    margin-left: 3px;
    vertical-align: -3px;
    background: #00ff66;
    animation: oreCursorBlink 0.8s step-end infinite;
}

@keyframes oreCursorBlink {
    0%, 45% {
        opacity: 1;
    }

    46%, 100% {
        opacity: 0;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #sidebar {
        position: absolute;
        box-shadow: 20px 0 50px rgba(0,0,0,0.7);
    }

    #sidebar.collapsed {
        margin-left: -260px;
    }

    #open-sidebar-btn {
        display: flex;
    }

    .top-right-offer {
        right: 10px;
    }

    .free-offer-btn {
        display: none;
    }

    .mode-pill {
        margin-left: 30px;
    }

    .hero-title {
        font-size: 25px;
    }

    .toolbar-right {
        gap: 5px;

/* =========================================================
   ORE RESPONSE
========================================================= */

async function typeOreResponse(response) {

    const currentMsg =
        document.getElementById(
            "ore-current-response"
        );

    let responseBox;

    let wrapper;


    if (currentMsg) {

        wrapper = currentMsg;

        responseBox =
            currentMsg.querySelector(
                ".ore-response"
            );

        currentMsg.innerHTML = "";

        currentMsg.removeAttribute("id");

        currentMsg.classList.add(
            "generating"
        );

    } else {

        wrapper =
            document.createElement("div");

        wrapper.className =
            "ore-message ore-message-ore generating";


        const header =
            document.createElement("div");

        header.className =
            "ore-message-header";


        const gem =
            createOreDiamond();


        const label =
            document.createElement("span");

        label.className =
            "ore-message-label";

        label.textContent =
            "Ore";


        header.appendChild(gem);

        header.appendChild(label);


        responseBox =
            document.createElement("div");

        responseBox.className =
            "ore-response";


        wrapper.appendChild(header);

        wrapper.appendChild(responseBox);

        conversation.appendChild(wrapper);

    }


    const cursor =
        document.createElement("span");

    cursor.className =
        "ore-cursor";

    responseBox.appendChild(cursor);


    for (
        let i = 0;
        i < response.length;
        i++
    ) {

        cursor.remove();

        responseBox.textContent +=
            response[i];

        responseBox.appendChild(cursor);

        conversation.scrollTop =
            conversation.scrollHeight;


        let delay = 12;

        if (
            [".", ",", "!", "?"]
                .includes(response[i])
        ) {

            delay = 55;

        } else if (
            response[i] === "\n"
        ) {

            delay = 35;

        }

        await new Promise(
            resolve =>
                setTimeout(resolve, delay)
        );

    }


    cursor.remove();

    wrapper.classList.remove(
        "generating"
    );

    conversation.scrollTop =
        conversation.scrollHeight;

}

    if (!currentUser) {
        return null;
    }

    return db
        .collection("users")
        .doc(currentUser.uid)
        .collection("chats");

}


/* =========================================================
   CREATE CHAT
========================================================= */

async function createChat(firstMessage) {

    const chats =
        userChatsRef();

    if (!chats) {
        return null;
    }

    const title =
        firstMessage
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, 60) ||
        "New chat";


    const chatRef =
        chats.doc();


    await chatRef.set({

        title: title,

        language: selectedLanguage,

        createdAt:
            firebase.firestore.FieldValue.serverTimestamp(),

        updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()

    });


    currentChatId =
        chatRef.id;


    return currentChatId;

}


/* =========================================================
   SAVE MESSAGE
========================================================= */

async function saveMessage(
    chatId,
    role,
    content
) {

    if (
        !currentUser ||
        !chatId
    ) {
        return;
    }


    const chatRef =
        userChatsRef()
            .doc(chatId);


    await chatRef
        .collection("messages")
        .add({

            role: role,

            content: content,

            language: selectedLanguage,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });


    await chatRef.update({

        updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()

    });

}


/* =========================================================
   LOAD CHAT HISTORY
========================================================= */

async function loadChatHistory() {

    if (!currentUser) {
        return;
    }


    chatHistory.innerHTML = "";


    try {

        const snapshot =
            await userChatsRef()
                .orderBy(
                    "updatedAt",
                    "desc"
                )
                .limit(30)
                .get();


        snapshot.forEach(doc => {

            renderHistoryItem(
                doc.id,
                doc.data()
            );

        });


    } catch (error) {

        console.error(
            "Could not load chat history:",
            error
        );

    }

}


/* =========================================================
   RENDER HISTORY ITEM
========================================================= */

function renderHistoryItem(
    chatId,
    data
) {

    const item =
        document.createElement("div");

    item.className =
        "chat-history-item";

    item.dataset.chatId =
        chatId;


    const title =
        document.createElement("span");

    title.className =
        "chat-history-title";

    title.textContent =
        data.title || "New chat";


    const menuButton =
        document.createElement("button");

    menuButton.className =
        "chat-history-menu-btn";

    menuButton.innerHTML =
        "⋮";

    menuButton.title =
        "Chat options";


    menuButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            openChatMenu(
                chatId,
                menuButton
            );

        }
    );


    item.appendChild(title);

    item.appendChild(menuButton);


    item.addEventListener(
        "click",
        () => {

            loadChat(
                chatId
            );

        }
    );


    chatHistory.appendChild(item);

}


/* =========================================================
   CHAT MENU
========================================================= */

let activeChatMenu = null;


function openChatMenu(
    chatId,
    button
) {

    closeChatMenu();


    const menu =
        document.createElement("div");

    menu.className =
        "chat-history-dropdown visible";


    const rename =
        document.createElement("button");

    rename.className =
        "history-menu-item";

    rename.textContent =
        "Rename";


    rename.onclick = () => {

        closeChatMenu();

        renameChat(chatId);

    };


    const deleteButton =
        document.createElement("button");

    deleteButton.className =
        "history-menu-item delete";

    deleteButton.textContent =
        "Delete";


    deleteButton.onclick = () => {

        closeChatMenu();

        deleteChat(chatId);

    };


    menu.appendChild(rename);

    menu.appendChild(deleteButton);

    document.body.appendChild(menu);

    activeChatMenu =
        menu;


    const rect =
        button.getBoundingClientRect();

    menu.style.left =
        `${rect.right - 150}px`;

    menu.style.top =
        `${rect.bottom + 5}px`;

}


function closeChatMenu() {

    if (activeChatMenu) {

        activeChatMenu.remove();

        activeChatMenu = null;

    }

}


document.addEventListener(
    "click",
    () => {

        closeChatMenu();

    }
);


/* =========================================================
   RENAME CHAT
========================================================= */

async function renameChat(chatId) {

    if (!currentUser) {
        return;
    }


    const chatRef =
        userChatsRef()
            .doc(chatId);


    const snapshot =
        await chatRef.get();


    if (!snapshot.exists) {
        return;
    }


    const currentTitle =
        snapshot.data().title ||
        "New chat";


    const newTitle =
        prompt(
            "Rename chat:",
            currentTitle
        );


    if (
        !newTitle ||
        !newTitle.trim()
    ) {
        return;
    }


    await chatRef.update({

        title:
            newTitle
                .trim()
                .slice(0, 80),

        updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()

    });


    await loadChatHistory();

}


/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(chatId) {

    if (!currentUser) {
        return;
    }


    const confirmed =
        confirm(
            "Delete this chat?"
        );


    if (!confirmed) {
        return;
    }


    const chatRef =
        userChatsRef()
            .doc(chatId);


    try {

        const messages =
            await chatRef
                .collection("messages")
                .get();


        const batch =
            db.batch();


        messages.forEach(doc => {

            batch.delete(doc.ref);

        });


        batch.delete(chatRef);


        await batch.commit();


        if (
            currentChatId === chatId
        ) {

            startNewChat();

        }


        await loadChatHistory();


    } catch (error) {

        console.error(
            "Delete chat failed:",
            error
        );

    }

}


/* =========================================================
   LOAD ONE CHAT
========================================================= */

async function loadChat(chatId) {

    if (
        !currentUser ||
        isGenerating
    ) {
        return;
    }


    try {

        const chatRef =
            userChatsRef()
                .doc(chatId);


        const chatSnapshot =
            await chatRef.get();


        if (!chatSnapshot.exists) {
            return;
        }


        const chatData =
            chatSnapshot.data();


        currentChatId =
            chatId;


        conversation.innerHTML = "";

        conversation.style.display =
            "flex";

        document.body.classList.add(
            "chat-active"
        );


        const messages =
            await chatRef
                .collection("messages")
                .orderBy(
                    "createdAt",
                    "asc"
                )
                .get();


        messages.forEach(doc => {

            const message =
                doc.data();


            if (
                message.role === "user"
            ) {

                addUserMessage(
                    message.content
                );

            } else {

                addLoadedOreMessage(
                    message.content
                );

            }

        });


        document
            .querySelectorAll(
                ".chat-history-item"
            )
            .forEach(item => {

                item.classList.toggle(
                    "active",
                    item.dataset.chatId === chatId
                );

            });


        conversation.scrollTop =
            conversation.scrollHeight;


    } catch (error) {

        console.error(
            "Could not load chat:",
            error
        );

    }

}


/* =========================================================
   LOADED ORE MESSAGE
========================================================= */

function addLoadedOreMessage(
    response
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "ore-message ore-message-ore";


    const header =
        document.createElement("div");

    header.className =
        "ore-message-header";


    const gem =
        createOreDiamond();


    const label =
        document.createElement("span");

    label.className =
        "ore-message-label";

    label.textContent =
        "Ore";


    header.appendChild(gem);

    header.appendChild(label);


    const responseBox =
        document.createElement("div");

    responseBox.className =
        "ore-response";

    responseBox.textContent =
        response;


    wrapper.appendChild(header);

    wrapper.appendChild(responseBox);

    conversation.appendChild(wrapper);

}


/* =========================================================
   NEW CHAT
========================================================= */

function startNewChat() {

    if (isGenerating) {
        return;
    }


    currentChatId =
        null;


    conversation.innerHTML = "";

    conversation.style.display =
        "none";

    document.body.classList.remove(
        "chat-active"
    );


    chatInput.value = "";

    chatInput.style.height =
        "auto";


    document
        .querySelectorAll(
            ".chat-history-item"
        )
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    if (currentUser) {

        const displayName =
            currentUser.displayName ||
            currentUser.email
                ?.split("@")[0] ||
            "there";

        const firstName =
            displayName.split(" ")[0];

        const hour =
            new Date().getHours();


        if (
            hour >= 5 &&
            hour < 12
        ) {

            heroTitle.textContent =
                `Good morning, ${firstName}. Put Ore for talk. Wetin you wan do today?`;

        } else if (
            hour >= 12 &&
            hour < 18
        ) {

            heroTitle.textContent =
                `Good afternoon, ${firstName}. Put Ore for talk. Wetin you wan do today?`;

        } else {

            heroTitle.textContent =
                `Good evening, ${firstName}. Put Ore for talk. Wetin you wan do today?`;

        }

    }

}


document
    .getElementById("new-chat-btn")
    .addEventListener(
        "click",
        startNewChat
    );


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (!currentUser) {

        openAuthModal();

        return;

    }


    if (isGenerating) {
        return;
    }


    const message =
        chatInput.value.trim();


    if (!message) {
        return;
    }


    isGenerating = true;


    document.body.classList.add(
        "chat-active"
    );


    conversation.style.display =
        "flex";


    /*
       Create Firestore chat only
       when the first message is sent.
    */

    if (!currentChatId) {

        try {

            await createChat(
                message
            );

            await loadChatHistory();

        } catch (error) {

            console.error(
                "Could not create chat:",
                error
            );

        }

    }


    addUserMessage(message);


    /*
       Save user's message.
    */

    try {

        await saveMessage(
            currentChatId,
            "user",
            message
        );

    } catch (error) {

        console.error(
            "Could not save user message:",
            error
        );

    }


    chatInput.value = "";

    chatInput.style.height =
        "auto";


    /*
       NEW THINKING ANIMATION
    */

    showThinking();


    try {

        const response =
            await fetch(
                CHAT_ENDPOINT,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "ngrok-skip-browser-warning":
                            "true"
                    },

                    body: JSON.stringify({

                        message: message,

                        language:
                            selectedLanguage

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                `Ore backend returned ${response.status}`
            );

        }


        const data =
            await response.json();


        const oreResponse =
            data.response ||
            "I no get response for that one yet.";


        /*
           Display response.
        */

        await typeOreResponse(
            oreResponse
        );


        /*
           Save Ore response.
        */

        try {

            await saveMessage(
                currentChatId,
                "ore",
                oreResponse
            );

        } catch (error) {

            console.error(
                "Could not save Ore response:",
                error
            );

        }


        await loadChatHistory();


    } catch (error) {

        console.error(
            "ORE ERROR:",
            error
        );


        const errorResponse =
            "I no fit connect to Ore backend right now.";


        await typeOreResponse(
            errorResponse
        );


        try {

            await saveMessage(
                currentChatId,
                "ore",
                errorResponse
            );

        } catch (saveError) {

            console.error(
                "Could not save error response:",
                saveError
            );

        }

    } finally {

        isGenerating = false;

        chatInput.focus();

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

chatInput.addEventListener(
    "input",
    () => {

        chatInput.style.height =
            "auto";

        chatInput.style.height =
            Math.min(
                chatInput.scrollHeight,
                180
            ) + "px";

    }
);

);

console.log(

);

console.log(

);

console.log(

);
